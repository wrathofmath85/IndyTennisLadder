<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>2026 Indy Tennis Singles Ladder</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#0b0e14; --panel:#11161f; --muted:#8ea0b4; --text:#e9eef5; --rule:#253043;
    --accent:#5dd0ff; --accent-ink:#052c3a; --ok:#3bd37f; --bad:#ff6b6b;
    --chip:#1a2332; --chipBorder:#2a364a; --chipBlue:#173049; --chipBlueBorder:#284564;
    --chipPurple:#251e42; --chipPurpleBorder:#3b2f6a; --shadow: 0 20px 60px rgba(0,0,0,.45);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  html,body{background:linear-gradient(180deg,#0b0e14, #0b0e14 180px, #0d121b 100%); color:var(--text); min-height:100%;}
  body{ margin:24px; display:flex; justify-content:center; }
  .wrap{ width:100%; max-width:1100px; }

  header{ background:linear-gradient(180deg,#0f1521,#0d131e); border:1px solid var(--rule);
    border-radius:14px; padding:18px 18px 14px; box-shadow: var(--shadow);}

  .title{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;}
  .title h1{ font-size:22px; margin:0; letter-spacing:.2px;}

  /* Round select with visible chevron */
  .round-select-wrap{ position:relative; display:inline-block; }
  .round-select-wrap::after{
    content:'▾'; position:absolute; right:10px; top:50%; transform:translateY(-50%);
    color:var(--muted); font-size:11px; pointer-events:none;
  }
  .round-select{ appearance:none; font-size:12px; padding:6px 26px 6px 10px; border-radius:999px;
    background:var(--chip); border:1px solid var(--chipBorder); color:var(--muted); cursor:pointer; }

  .meta{ margin-top:8px; color:var(--muted); font-size:14px; display:flex; gap:10px; flex-wrap:wrap;}
  .meta .dot::before{content:"•"; margin:0 8px; color:#3a4b66;}

  .panel{ margin-top:18px; background:var(--panel); border:1px solid var(--rule); border-radius:12px; overflow:auto; -webkit-overflow-scrolling:touch; }
  table{ width:100%; min-width:980px; border-collapse:collapse; font-size:14px; table-layout:auto; }
  thead th{ text-align:left; font-weight:600; color:#b9c6d8; background:#0f1521; border-bottom:1px solid var(--rule);
    padding:12px; position:sticky; top:0; z-index:2; box-shadow:0 2px 0 0 var(--rule); white-space:nowrap; }
  tbody td{ border-bottom:1px solid var(--rule); padding:12px; vertical-align:middle; white-space:nowrap; }
  tbody tr:hover{ background:rgba(255,255,255,.03); }

  /* ===== Rainbow group bands (groups of 8 by rank) ===== */
  /* Each row gets a 3px left border coloured by its rank group.
     The row background is a very faint tint of the same hue. */
  tbody tr.group-1{ border-left:3px solid rgba(255,80,80,.75);  background:rgba(255,80,80,.04); }
  tbody tr.group-2{ border-left:3px solid rgba(255,150,30,.75); background:rgba(255,150,30,.04); }
  tbody tr.group-3{ border-left:3px solid rgba(255,220,0,.75);  background:rgba(255,220,0,.04); }
  tbody tr.group-4{ border-left:3px solid rgba(60,200,80,.75);  background:rgba(60,200,80,.04); }
  tbody tr.group-5{ border-left:3px solid rgba(30,180,200,.75); background:rgba(30,180,200,.04); }
  tbody tr.group-6{ border-left:3px solid rgba(80,120,255,.75); background:rgba(80,120,255,.04); }
  tbody tr.group-7{ border-left:3px solid rgba(160,60,220,.75); background:rgba(160,60,220,.04); }
  /* groups 8+ cycle back through — enough for any league size */
  tbody tr.group-8{ border-left:3px solid rgba(255,80,80,.75);  background:rgba(255,80,80,.04); }
  tbody tr:hover{ background:rgba(255,255,255,.06) !important; }

  /* left/right rank+points columns */
  .rp{ width:210px; color:#cdd8e6; font-variant-numeric: tabular-nums; }
  .rp .sub{ display:block; margin-top:4px; font-size:12px; color:var(--muted); font-weight:600; }
  .rp.right{ width:260px; }

  /* rank movement arrow in the right column */
  .move{ display:inline-block; font-size:11px; font-weight:800; padding:1px 6px; border-radius:999px; margin-left:6px; vertical-align:middle; }
  .move-up{   background:rgba(59,211,127,.15); color:#3bd37f; }
  .move-down{ background:rgba(255,107,107,.15); color:#ff6b6b; }
  .move-same{ background:rgba(255,255,255,.06); color:#6e7f98; }

  .name{ font-weight:700; }

  /* Phone hidden behind a tap/click — show on hover/focus */
  .phone-wrap{ display:block; margin-top:4px; }
  .phone-toggle{
    background:none; border:none; padding:0; cursor:pointer;
    font-size:12px; color:#6a8aaa; font-weight:600; letter-spacing:.2px;
    transition:color .15s;
  }
  .phone-toggle:hover{ color:var(--muted); }
  .phone-reveal{ font-size:12px; font-weight:600; color:var(--muted); letter-spacing:.2px; display:none; }
  .phone-reveal.shown{ display:inline; }

  /* mobile head line (rank + name + (round pts)) */
  .m-head{ display:none; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .m-rank{ font-weight:900; font-variant-numeric: tabular-nums; color:#cdd8e6; flex:0 0 auto; }
  .m-name{ font-weight:900; color:#e9eef5; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .m-pts{
    font-size:12px; font-weight:800; color:#cdd8e6;
    padding:2px 8px; border-radius:999px;
    background:#101827; border:1px solid #253043;
    white-space:nowrap;
  }
  .m-pts b{ color:#e9eef5; font-variant-numeric: tabular-nums; }

  .result{ font-weight:600; }
  .won{ color:var(--ok); }
  .lost{ color:var(--bad); }

  /* Pending match indicator */
  .pending{ color:#3a4f6a; font-style:italic; font-size:13px; }

  .loading, .error{ margin:22px 0; padding:14px 16px; border-radius:10px; background:#0f1521; border:1px solid var(--rule); color:#8ea0b4; }

  .badge{ display:inline-block; padding:2px 8px; border-radius:999px; border:1px solid var(--chipBorder);
    background:var(--chip); color:var(--muted); font-size:12px; margin-right:8px; white-space:nowrap; flex:0 0 auto; }
  .badge-scheduled{ background:var(--chipBlue); border-color:var(--chipBlueBorder); }
  .badge-challenge{ background:var(--chipPurple); border-color:var(--chipPurpleBorder); }

  /* Points pills — interactive with hover/focus states and a ? hint */
  .winner-pts, .loser-pts{
    display:inline-flex; align-items:center; gap:5px; margin-left:10px; padding:2px 8px 2px 6px;
    border-radius:999px; font-size:12px; cursor:pointer; user-select:none;
    position:relative; z-index:3; pointer-events:auto; white-space:nowrap;
    transition: filter .15s, transform .1s;
  }
  .winner-pts:hover, .loser-pts:hover{ filter:brightness(1.25); transform:scale(1.04); }
  .winner-pts:focus-visible, .loser-pts:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .loser-pts{ background:#1a2230; border:1px solid #2a3548; color:#bcd0e5; }
  .winner-pts{ background:#12261b; border:1px solid #284c37; color:#c9edd7; }
  .loser-pts b,.winner-pts b{ font-variant-numeric:tabular-nums; color:#e9eef5; }
  .pts-hint{ font-size:10px; opacity:.55; margin-left:1px; }

  .matches{ white-space:nowrap; min-width:520px; }
  .match-line{ display:flex; align-items:center; gap:8px; min-height:26px; }
  .match-line.empty{ opacity:.0; }

  .repeat-opp{ background:#fff200; color:#000; padding:1px 6px; border-radius:8px; font-weight:900; box-shadow:0 0 0 1px rgba(0,0,0,.35) inset; }

  .m-stats{ display:none; margin-top:10px; padding-top:10px; border-top:1px dashed #23324a; color:var(--muted);
    font-size:13px; white-space:nowrap; gap:14px; align-items:center; }
  .m-stats b{ color:#e9eef5; font-variant-numeric: tabular-nums; }

  .backdrop{ position:fixed; inset:0; background:rgba(8,12,20,.55); opacity:0; pointer-events:none; transition:opacity .15s ease; z-index:10000; }
  .backdrop.show{ opacity:1; pointer-events:auto; }
  .modal{ position:fixed; left:50%; top:50%; transform:translate(-50%,-46%) scale(.98); background:#0f1521; border:1px solid var(--rule);
    border-radius:16px; box-shadow:var(--shadow); width:min(92vw,560px); opacity:0; transition:opacity .15s ease, transform .18s ease; z-index:10001; }
  .modal.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--rule);
    background:#11192a; border-top-left-radius:16px; border-top-right-radius:16px; }
  .modal-title{ font-weight:700; font-size:18px; letter-spacing:.2px; }
  .modal-close{ appearance:none; border:1px solid #334258; background:#1a2436; color:#c9d6e6; border-radius:8px; width:28px; height:28px;
    font-size:16px; line-height:26px; text-align:center; cursor:pointer; }
  .modal-body{ padding:16px; color:#d2deee; max-height:70vh; overflow:auto; -webkit-overflow-scrolling:touch; }
  .modal-body p{ margin:0 0 8px 0; line-height:1.5; }
  .modal-body .tip{ margin-top:10px; font-size:13px; color:#93a6bf; border-top:1px dashed #2a3750; padding-top:10px; }

  /* Clickable participant names → open match history */
  .name-link{ cursor:pointer; }
  .name-link:hover{ color:var(--accent); text-decoration:underline; }
  .name-link:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  /* Match-history modal contents */
  .hist-round{ margin-bottom:16px; }
  .hist-round:last-child{ margin-bottom:0; }
  .hist-round-title{ font-weight:800; font-size:12px; color:#b9c6d8; text-transform:uppercase; letter-spacing:.6px;
    margin-bottom:8px; padding-bottom:5px; border-bottom:1px solid var(--rule); }
  .hist-match{ display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:6px 0; font-size:14px; }
  .hist-match .result{ font-weight:600; }
  .hist-pts{ font-size:12px; color:#cdd8e6; background:#101827; border:1px solid #253043;
    padding:2px 8px; border-radius:999px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .hist-empty{ color:#8ea0b4; font-style:italic; }

  /* ===== Bracket stage view ===== */
  .stage{ margin-top:18px; }
  .stage-note{ margin:0 0 14px; color:var(--muted); font-size:13px; line-height:1.5; }
  .test-note{ display:inline-block; margin-left:8px; padding:2px 10px; border-radius:999px;
    background:rgba(93,208,255,.12); border:1px solid rgba(93,208,255,.4); color:var(--accent);
    font-size:12px; font-weight:800; }
  .bracket-card{ background:var(--panel); border:1px solid var(--rule); border-radius:12px;
    padding:14px; margin-bottom:18px; box-shadow:var(--shadow); }
  .bracket-head{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .bracket-head h2{ margin:0; font-size:18px; letter-spacing:.2px; }
  .bracket-sub{ color:var(--muted); font-size:13px; }
  .bkt-cols{ display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch; }
  .bkt-col{ min-width:235px; max-width:280px; flex:1 0 235px; display:flex; flex-direction:column; gap:10px; }
  .bkt-col-title{ font-size:11px; font-weight:800; letter-spacing:.6px; text-transform:uppercase;
    color:#b9c6d8; padding-bottom:5px; border-bottom:1px solid var(--rule); }
  .bkt-m{ background:#0e1420; border:1px solid var(--rule); border-radius:10px; padding:8px 10px; font-size:13px; }
  .bkt-m-title{ color:var(--muted); font-size:11px; font-weight:700; margin-bottom:6px;
    display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .bkt-line{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:2px 0; min-width:0; }
  .bkt-name{ font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .bkt-name .sd{ color:var(--muted); font-weight:600; margin-right:6px; font-variant-numeric:tabular-nums; font-size:12px; }
  .bkt-win{ color:var(--ok); }
  .bkt-lose{ color:#8ea0b4; }
  .bkt-tbd{ color:#5b6c85; font-style:italic; font-weight:600; }
  .bkt-score{ color:#b9c6d8; font-variant-numeric:tabular-nums; white-space:nowrap; font-size:12px; }
  .bkt-phone-line{ padding:0 0 3px 0; }
  .bkt-phone-toggle{
    background:none; border:none; padding:0; cursor:pointer;
    font-size:11px; color:#5b6c85; text-decoration:underline dotted;
  }
  .bkt-phone-toggle:hover{ color:var(--muted); }
  .bkt-phone-line .phone-reveal{ margin-left:6px; }
  .place-chip .name-link{ color:inherit; }
  .bkt-tag{ font-size:10px; font-weight:800; border-radius:999px; padding:1px 7px; white-space:nowrap; }
  .bkt-tag.ready{ background:rgba(245,166,35,.15); color:#f5a623; }
  .bkt-tag.done{ background:rgba(59,211,127,.15); color:var(--ok); }
  .bkt-tag.bye{ background:rgba(255,255,255,.06); color:#6e7f98; }
  .bkt-places{ margin-top:12px; display:flex; flex-wrap:wrap; gap:8px; }
  .place-chip{ font-size:12px; background:#101827; border:1px solid #253043; border-radius:999px;
    padding:3px 10px; color:#cdd8e6; font-variant-numeric:tabular-nums; }
  .place-chip b{ color:#e9eef5; }
  .place-chip.tbd{ opacity:.55; font-style:italic; }

  /* ===== Final standings view ===== */
  .final-panel{ background:var(--panel); border:1px solid var(--rule); border-radius:12px;
    overflow:hidden; box-shadow:var(--shadow); }
  .final-row{ display:flex; align-items:center; gap:12px; padding:11px 14px;
    border-bottom:1px solid var(--rule); font-size:14px; }
  .final-row:last-child{ border-bottom:none; }
  .final-row .frank{ flex:0 0 58px; font-weight:900; font-variant-numeric:tabular-nums; color:#cdd8e6; }
  .final-row .fname{ flex:1 1 auto; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .final-row .fnote{ flex:0 1 auto; color:var(--muted); font-size:12px; text-align:right; white-space:nowrap; }
  .final-row.pending .fname, .final-row.pending .fnote{ color:#5b6c85; font-style:italic; font-weight:600; }
  .final-row.podium{ background:rgba(93,208,255,.05); }
  .fmedal{ margin-right:6px; }

  @media (max-width:720px){
    thead{ display:none; }
    table,tbody,tr,td{ display:block; width:100%; min-width:0; }
    .panel{ overflow:visible; }
    tbody tr{ padding:14px 12px; border-bottom:1px solid var(--rule); background:transparent; border-left-width:3px; border-left-style:solid; }
    tbody tr:hover{ background:rgba(255,255,255,.04) !important; }
    tbody td{ border:0; padding:6px 0; white-space:normal; }

    .rp-left{ display:none; }
    .rp-right{ display:none; }

    .m-head{ display:flex; }
    .name{ display:none; }
    .matches{ order:2; min-width:0; }

    .badge-scheduled{ padding:2px 7px; }
    .badge-challenge{ padding:2px 7px; }

    .m-stats{ display:flex; }
    .winner-pts,.loser-pts{ margin-left:0; margin-top:6px; }
    .match-line.empty{ display:none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">
        <h1>Indy Tennis Ladder</h1>
        <div class="round-select-wrap">
          <select id="roundSelect" class="round-select" aria-label="Select round"></select>
        </div>
      </div>
      <div class="meta" id="roundMeta"></div>
    </header>

    <div class="panel" id="ladderPanel">
      <div class="loading" id="status">Loading data…</div>
      <table id="ladder" style="display:none;">
        <thead>
          <tr>
            <th class="rp" id="thLeft">Round 1 Ranking - Points</th>
            <th>Participant</th>
            <th class="matches">Result</th>
            <th class="rp right" id="thRight">Round 2 Ranking - Points</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <!-- Bracket stage / final standings view -->
    <div id="stageView" class="stage" style="display:none;"></div>


  </div>

  <div class="backdrop" id="backdrop" aria-hidden="true"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Info</div>
      <button class="modal-close" id="modalClose" aria-label="Close">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>

<script>
/* ===== CONFIG ===== */
const CURRENT_ROUND_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQVvOJ0QcM4OuUYeUYCTr9KSULN5PUf0KeTGT5iQcxvOy6G9W8KmiZGneahPmpVLiTuOgDCL42aTjb/pub?gid=972964638&single=true&output=csv';
let CurrentRound = 2;

const CSV = {
  Players: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQVvOJ0QcM4OuUYeUYCTr9KSULN5PUf0KeTGT5iQcxvOy6G9W8KmiZGneahPmpVLiTuOgDCL42aTjb/pub?gid=0&single=true&output=csv',
  Schedule: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQVvOJ0QcM4OuUYeUYCTr9KSULN5PUf0KeTGT5iQcxvOy6G9W8KmiZGneahPmpVLiTuOgDCL42aTjb/pub?gid=1596015267&single=true&output=csv',
  Dates: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQVvOJ0QcM4OuUYeUYCTr9KSULN5PUf0KeTGT5iQcxvOy6G9W8KmiZGneahPmpVLiTuOgDCL42aTjb/pub?gid=838168726&single=true&output=csv',
  ScoresRound1: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQVvOJ0QcM4OuUYeUYCTr9KSULN5PUf0KeTGT5iQcxvOy6G9W8KmiZGneahPmpVLiTuOgDCL42aTjb/pub?gid=1813586077&single=true&output=csv',
  ScoresRound2: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQVvOJ0QcM4OuUYeUYCTr9KSULN5PUf0KeTGT5iQcxvOy6G9W8KmiZGneahPmpVLiTuOgDCL42aTjb/pub?gid=667416587&single=true&output=csv',
  ScoresRound3: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQVvOJ0QcM4OuUYeUYCTr9KSULN5PUf0KeTGT5iQcxvOy6G9W8KmiZGneahPmpVLiTuOgDCL42aTjb/pub?gid=1340896382&single=true&output=csv',
  ScoresRound4: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQVvOJ0QcM4OuUYeUYCTr9KSULN5PUf0KeTGT5iQcxvOy6G9W8KmiZGneahPmpVLiTuOgDCL42aTjb/pub?gid=1779797386&single=true&output=csv',
  ScoresRound5: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQVvOJ0QcM4OuUYeUYCTr9KSULN5PUf0KeTGT5iQcxvOy6G9W8KmiZGneahPmpVLiTuOgDCL42aTjb/pub?gid=1138515130&single=true&output=csv',
  ScoresRound6: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQVvOJ0QcM4OuUYeUYCTr9KSULN5PUf0KeTGT5iQcxvOy6G9W8KmiZGneahPmpVLiTuOgDCL42aTjb/pub?gid=2117392535&single=true&output=csv',
  ScoresRound7: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQVvOJ0QcM4OuUYeUYCTr9KSULN5PUf0KeTGT5iQcxvOy6G9W8KmiZGneahPmpVLiTuOgDCL42aTjb/pub?gid=454354939&single=true&output=csv',
  ScoresRound8: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQVvOJ0QcM4OuUYeUYCTr9KSULN5PUf0KeTGT5iQcxvOy6G9W8KmiZGneahPmpVLiTuOgDCL42aTjb/pub?gid=1429948565&single=true&output=csv',
  ScoresRound9: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQVvOJ0QcM4OuUYeUYCTr9KSULN5PUf0KeTGT5iQcxvOy6G9W8KmiZGneahPmpVLiTuOgDCL42aTjb/pub?gid=656808017&single=true&output=csv',
  ScoresRound10:'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQVvOJ0QcM4OuUYeUYCTr9KSULN5PUf0KeTGT5iQcxvOy6G9W8KmiZGneahPmpVLiTuOgDCL42aTjb/pub?gid=1886048839&single=true&output=csv'
};

let ROUND = 1;

/* ===== BRACKET STAGE CONFIG ===== */
// TEST_MODE = true  → forces CurrentRound to 7 (so both the "Round 6 – Brackets" and
//                     "Final Standings" views are available) and reads scores from
//                     "Round 6 Scores TEST" via the Apps Script endpoint.
// TEST_MODE = false → live behavior: views unlock as Current Round advances, and
//                     bracket scores come from the real "Round 6 Scores" tab.
const TEST_MODE = true;
const BRACKET_START_ROUND = 6;
const SCRIPT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbwfs7OO_tAXSjAaoiFTp_ySQJbiaXWw3u37F7YJYZ2-kS-AHoLfaeVPfnkLUnoUW3DeDA/exec';
const BRACKET_SCORES_SHEET = `Round ${BRACKET_START_ROUND} Scores` + (TEST_MODE ? ' TEST' : '');

/* =====================================================================
   BRACKET ENGINE (shared between SubmitScores + Standings pages)
   Builds placement brackets of 8 (padded with BYEs) or 16 slots for
   merged brackets of 9-11 players. BYEs automatically lose every match,
   which forwards real players and cascades byes down the draw exactly
   per league rules. Every match decides toward a final placement.
   ===================================================================== */
const BK = (function(){
  'use strict';

  const BYE = Object.freeze({ bye:true, name:'BYE' });

  const bkFmt = v => (v===undefined||v===null) ? '' : String(v).trim();
  const bkKey = s => bkFmt(s).toLowerCase();
  const pairKey = (a,b) => { const x=bkKey(a), y=bkKey(b); return x<y ? x+'|'+y : y+'|'+x; };
  function ordinal(n){ const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }

  /* Standard seeded bracket slot order, e.g. 8 -> [1,8,4,5,2,7,3,6] */
  function seedOrder(n){
    let arr=[1];
    while(arr.length<n){
      const m=arr.length*2, next=[];
      for(const x of arr) next.push(x, m+1-x);
      arr=next;
    }
    return arr;
  }

  /* Groups of 8 by seed; if the last group has <4 players it merges
     into the previous group (making it 9-11). */
  function chunkBrackets(seeded){
    const groups=[];
    for(let i=0;i<seeded.length;i+=8) groups.push(seeded.slice(i,i+8));
    if(groups.length>1 && groups[groups.length-1].length<4){
      const last=groups.pop();
      groups[groups.length-1]=groups[groups.length-1].concat(last);
    }
    return groups;
  }

  /* Build the full match tree for one bracket. group = [{name, seed}] in
     seed order (seed = overall ladder position). */
  function buildBracketMatches(label, group){
    const n=group.length;
    const size = n<=8 ? 8 : 16;
    const order=seedOrder(size);
    const slots=order.map(s => s<=n
      ? { name:group[s-1].name, seed:group[s-1].seed, local:s }
      : BYE);
    const matches=[];
    function rec(entries, placeLo, roundIdx){
      const s=entries.length;
      const round=[];
      for(let i=0;i<s;i+=2){
        const m={
          id:matches.length,
          code:'', // filled after build: e.g. "A3"
          bracket:label,
          groupSize:s,
          placeLo,
          placeHi:placeLo+s-1,
          roundIdx,
          a:entries[i], b:entries[i+1],
          pa:null, pb:null,
          done:false, ready:false, auto:false,
          winner:null, loser:null, row:null,
          decides: (s===2) ? [placeLo, placeLo+1] : null
        };
        matches.push(m); round.push(m);
      }
      if(s===2) return;
      rec(round.map(m=>({from:m, take:'winner'})), placeLo, roundIdx+1);
      rec(round.map(m=>({from:m, take:'loser'})),  placeLo+s/2, roundIdx+1);
    }
    rec(slots, 1, 0);
    matches.forEach((m,i)=>{ m.code = label + (i+1); });
    return {
      label, size, n, matches,
      players: group,
      rankStart: group.length ? 1 : 1 // set by caller
    };
  }

  function matchLabel(m){
    if(m.decides) return m.placeLo===1 ? 'Final' : ordinal(m.placeLo)+' Place Match';
    if(m.groupSize===16) return 'Opening Round';
    if(m.groupSize===8)  return m.placeLo===1 ? 'Quarterfinal' : 'Back Draw QF (Places '+m.placeLo+'\u2013'+m.placeHi+')';
    if(m.groupSize===4)  return m.placeLo===1 ? 'Semifinal'    : 'Back Draw SF (Places '+m.placeLo+'\u2013'+m.placeHi+')';
    return 'Places '+m.placeLo+'\u2013'+m.placeHi;
  }

  function srcParticipant(src){
    if(!src) return null;
    if(src.from){
      if(!src.from.done) return null;
      return src.take==='winner' ? src.from.winner : src.from.loser;
    }
    return src; // a slot entry or BYE
  }

  /* Human description of an unresolved source, e.g. "Winner of A2" */
  function srcDesc(src){
    if(!src) return '';
    if(src.from) return (src.take==='winner'?'Winner of ':'Loser of ')+src.from.code;
    return src.bye ? 'BYE' : src.name;
  }

  /* Apply results. resultsByPair: Map(pairKey -> scoreRow). Loops until
     stable so order of submissions never matters. */
  function resolveBracket(br, resultsByPair){
    let changed=true;
    while(changed){
      changed=false;
      for(const m of br.matches){
        if(m.done) continue;
        const A=srcParticipant(m.a), B=srcParticipant(m.b);
        m.pa=A; m.pb=B;
        if(!A||!B) continue;
        if(A.bye&&B.bye){ m.done=true; m.auto=true; m.winner=BYE; m.loser=BYE; changed=true; continue; }
        if(A.bye||B.bye){ m.done=true; m.auto=true; m.winner=A.bye?B:A; m.loser=A.bye?A:B; changed=true; continue; }
        const row=resultsByPair.get(pairKey(A.name,B.name));
        if(row){
          const w = bkKey(row.Winner)===bkKey(A.name) ? A : B;
          m.done=true; m.winner=w; m.loser=(w===A)?B:A; m.row=row; changed=true;
        }
      }
    }
    br.matches.forEach(m=>{
      m.ready = !m.done && !!m.pa && !!m.pb && !m.pa.bye && !m.pb.bye;
    });
    br.placements = {}; // internal place (1..size) -> participant
    br.matches.forEach(m=>{
      if(m.decides && m.done){
        br.placements[m.decides[0]] = m.winner;
        br.placements[m.decides[1]] = m.loser;
      }
    });
    br.complete = (function(){
      for(let p=1;p<=br.n;p++){
        const part=br.placements[p];
        if(!part || part.bye) return false;
      }
      return true;
    })();
  }

  /* seededPlayers: [{name, seed}] sorted by seed asc (seed = 1..N overall).
     scoreRows: rows from the Round 6 Scores sheet (Winner/Opponent/S1_W...).
     Later rows for the same pair overwrite earlier ones (corrections). */
  function buildAll(seededPlayers, scoreRows){
    const resultsByPair=new Map();
    (scoreRows||[]).forEach(r=>{
      const w=bkFmt(r.Winner), o=bkFmt(r.Opponent);
      if(!w||!o||bkKey(w)===bkKey(o)) return;
      resultsByPair.set(pairKey(w,o), r);
    });
    const groups=chunkBrackets(seededPlayers);
    const letters='ABCDEFGHIJKLMNOP';
    let offset=0;
    return groups.map((g,i)=>{
      const br=buildBracketMatches(letters[i]||('B'+(i+1)), g);
      br.rankStart=offset+1;
      br.rankEnd=offset+g.length;
      offset+=g.length;
      resolveBracket(br, resultsByPair);
      return br;
    });
  }

  /* Matches currently playable (both participants known, no score yet). */
  function readyMatches(brackets){
    const list=[];
    brackets.forEach(br=>br.matches.forEach(m=>{
      if(m.ready) list.push({
        bracket:br.label, code:m.code, label:matchLabel(m),
        a:m.pa, b:m.pb, match:m, br
      });
    }));
    return list;
  }

  /* Overall final rankings. Internal place p maps to overall rank
     rankStart-1+p (real players always occupy the top n places since
     byes lose every match). Returns [{rank, name|null, bracket, place,
     pending}] for every rank 1..N. */
  function finalRankings(brackets){
    const out=[];
    brackets.forEach(br=>{
      for(let p=1;p<=br.n;p++){
        const part=br.placements[p];
        out.push({
          rank: br.rankStart-1+p,
          place: p,
          bracket: br.label,
          name: (part && !part.bye) ? part.name : null,
          seed: (part && !part.bye) ? part.seed : null,
          pending: !(part && !part.bye)
        });
      }
    });
    return out;
  }

  return { BYE, buildAll, readyMatches, finalRankings, matchLabel, srcDesc, pairKey, ordinal };
})();

/* ===== helpers ===== */
function bustUrl(url){ return url + (url.includes('?') ? '&' : '?') + '_bust=' + Date.now(); }
function loadCSV(url){ return new Promise((res, rej)=> Papa.parse(bustUrl(url),{download:true,header:true,skipEmptyLines:'greedy',complete:r=>res(r.data||[]),error:rej})); }
const nameKey = s => String(s||'').trim().toLowerCase();
const num = v => (v===null||v===undefined||v==='') ? NaN : +String(v).toString().replace(/[% ,]/g,'');
const safeNum = v => { const n = num(v); return isNaN(n)?0:n; };
const fmt = v => (v===undefined||v===null) ? '' : String(v);
const round2 = x => Math.round((Number(x)+Number.EPSILON)*100)/100;
const fmtPts = v => (v===undefined||v===null||v==='') ? '' : (isNaN(Number(v)) ? '' : round2(v).toFixed(2));

function fmtDateRange(startRaw, endRaw){
  const parse = (val)=>{ if(val===''||val==null) return null;
    if(/^\d+(\.\d+)?$/.test(String(val))){ const d=Number(val); const base=new Date(Date.UTC(1899,11,30)); return new Date(base.getTime()+d*86400000); }
    const d=new Date(val); return isNaN(d)?null:d; };
  const s=parse(startRaw), e=parse(endRaw);
  const nice = d => d.toLocaleDateString(undefined,{month:'short', day:'numeric'});
  if(s&&e) return `${nice(s)} – ${nice(e)}`; if(s) return nice(s); if(e) return nice(e);
  return [fmt(startRaw),fmt(endRaw)].filter(Boolean).join(' – ');
}

function setStatus(msg,isError=false){ const st=document.getElementById('status'); st.textContent=msg; st.className=isError?'error':'loading'; }
async function fetchCurrentRound(){ try{ const rows=await loadCSV(CURRENT_ROUND_CSV); const r0=rows?.[0]||{}; const val=Number(r0['Current Round']??r0['CurrentRound']??r0['Round']??r0[Object.keys(r0)[0]]); if(!Number.isNaN(val)&&val>=1) CurrentRound=val; }catch{} }
function computeRoundFromURL(){
  const u=new URLSearchParams(location.search); const raw=u.get('round');
  if (raw==='final' && CurrentRound>=BRACKET_START_ROUND+1) return 'final';
  const maxView=Math.min(CurrentRound, BRACKET_START_ROUND);
  const q=parseInt(raw,10);
  if (!isNaN(q) && q>=1 && q<=maxView) return q;
  return (CurrentRound>=BRACKET_START_ROUND+1) ? 'final' : maxView;
}

/* ===== view toggling ===== */
function showLadderView(){
  document.getElementById('ladderPanel').style.display='';
  document.getElementById('stageView').style.display='none';
}
function showStageView(){
  document.getElementById('ladderPanel').style.display='none';
  const sv=document.getElementById('stageView'); sv.style.display=''; return sv;
}

/* ===== bracket stage data ===== */
async function fetchBracketScores(){
  const url = `${SCRIPT_ENDPOINT}?action=scores&sheet=${encodeURIComponent(BRACKET_SCORES_SHEET)}&_bust=${Date.now()}`;
  const res = await fetch(url,{cache:'no-store'});
  if(!res.ok) throw new Error('Bracket scores HTTP '+res.status);
  const data = await res.json();
  if(!data || data.ok!==true) throw new Error((data&&data.error)||'Bracket scores read failed');
  return data.rows||[];
}

let bktPhoneByName = {};   // nameKey -> phone (for bracket-stage display)

async function loadBracketData(){
  const r = BRACKET_START_ROUND;
  const [playersRaw, datesRaw, scoreRows] = await Promise.all([
    loadCSV(CSV.Players), loadCSV(CSV.Dates), fetchBracketScores()
  ]);
  bktPhoneByName = {};
  (playersRaw||[]).forEach(row=>{
    const nm=fmt(row.Participant); if(!nm) return;
    const ph=fmt(row.PHONE||row.Phone||row.phone);
    if(ph) bktPhoneByName[nameKey(nm)]=ph;
  });
  const active = (playersRaw||[]).filter(row=>{
    const start=num(row.RStart), end=num(row.REnd);
    return (isNaN(start)||start<=r) && (isNaN(end)||end>=r);
  });
  const seeded = active
    .map(row=>({ name: fmt(row.Participant), rank: num(row[`R${r}Rank`]) }))
    .filter(p=>p.name && !isNaN(p.rank) && p.rank>0)
    .sort((a,b)=>a.rank-b.rank)
    .map((p,i)=>({ name:p.name, seed:i+1 }));
  if(!seeded.length) throw new Error(`No players have an R${r}Rank yet — bracket seeding is unavailable.`);
  const brackets = BK.buildAll(seeded, scoreRows);
  return { brackets, datesRaw };
}

/* score line for a bracket match, from the winner's perspective */
function bktScore(row){
  if(!row) return '';
  const st=String(row.Status||'').toLowerCase();
  if(st.includes('walkover')) return 'walkover';
  const parts=[];
  const set=(w,o,tb)=>{
    if(fmt(w)===''&&fmt(o)==='') return;
    parts.push(`${fmt(w)}-${fmt(o)}${fmt(tb)!==''?'('+fmt(tb)+')':''}`);
  };
  set(row.S1_W,row.S1_O,row.Set1_T);
  set(row.S2_W,row.S2_O,row.Set2_T);
  set(row.S3_W,row.S3_O,row.Set3_T);
  if(fmt(row.TB_W)!==''||fmt(row.TB_O)!=='') parts.push(`[${fmt(row.TB_W)}-${fmt(row.TB_O)}]`);
  let s=parts.join(' ');
  if(st.includes('retired')) s+=' Ret';
  return s;
}

/* one participant line inside a match card */
function bktLineHTML(part, src, m){
  if (part && part.bye) return `<div class="bkt-line"><span class="bkt-name bkt-tbd">BYE</span></div>`;
  if (!part){
    return `<div class="bkt-line"><span class="bkt-name bkt-tbd">${escapeHtml(BK.srcDesc(src))}</span></div>`;
  }
  const isW = m.done && m.winner===part;
  const isL = m.done && m.loser===part;
  const cls = isW?'bkt-win':(isL?'bkt-lose':'');
  const score = (isW && m.row) ? `<span class="bkt-score">${escapeHtml(bktScore(m.row))}</span>` : '';
  let html = `<div class="bkt-line">
    <span class="bkt-name ${cls}"><span class="sd">#${part.seed}</span><span class="name-link" role="button" tabindex="0" title="Click to see match history" data-player="${escapeHtml(part.name)}">${escapeHtml(part.name)}</span></span>
    ${score}
  </div>`;
  // Phone (same reveal style as the ladder) for matches still to be played
  if (!m.done){
    const ph = bktPhoneByName[nameKey(part.name)] || '';
    if (ph){
      html += `<div class="bkt-phone-line"><button type="button" class="bkt-phone-toggle">Show phone</button><span class="phone-reveal">${escapeHtml(ph)}</span></div>`;
    }
  }
  return html;
}

/* reveal/hide phone in bracket cards (delegated — cards are re-rendered often) */
document.addEventListener('click', e=>{
  const btn = e.target.closest('.bkt-phone-toggle');
  if(!btn) return;
  const reveal = btn.nextElementSibling;
  if (reveal && reveal.classList.contains('phone-reveal')){
    const shown = reveal.classList.toggle('shown');
    btn.textContent = shown ? 'Hide' : 'Show phone';
  }
});

function renderBracketCard(br){
  const card=document.createElement('div'); card.className='bracket-card';
  const head=document.createElement('div'); head.className='bracket-head';
  head.innerHTML = `<h2>Bracket ${escapeHtml(br.label)}</h2>
    <span class="bracket-sub">Overall ranks ${br.rankStart}\u2013${br.rankEnd} \u00b7 ${br.n} players</span>`;
  card.appendChild(head);

  // columns by round
  const byRound=new Map();
  br.matches.forEach(m=>{
    if (m.done && m.auto && m.winner && m.winner.bye) return;   // hide BYE vs BYE
    if(!byRound.has(m.roundIdx)) byRound.set(m.roundIdx,[]);
    byRound.get(m.roundIdx).push(m);
  });
  const cols=document.createElement('div'); cols.className='bkt-cols';
  [...byRound.keys()].sort((a,b)=>a-b).forEach(ri=>{
    const col=document.createElement('div'); col.className='bkt-col';
    const t=document.createElement('div'); t.className='bkt-col-title'; t.textContent=`Round ${ri+1}`;
    col.appendChild(t);
    byRound.get(ri).sort((a,b)=>(a.placeLo-b.placeLo)||(a.id-b.id)).forEach(m=>{
      const box=document.createElement('div'); box.className='bkt-m';
      let tag='';
      if (m.done && m.auto) tag='<span class="bkt-tag bye">Bye</span>';
      else if (m.done) tag='<span class="bkt-tag done">Final</span>';
      else if (m.ready) tag='<span class="bkt-tag ready">Ready to play</span>';
      box.innerHTML = `<div class="bkt-m-title"><span>${escapeHtml(m.code)} \u00b7 ${escapeHtml(BK.matchLabel(m))}</span>${tag}</div>`
        + bktLineHTML(m.pa, m.a, m) + bktLineHTML(m.pb, m.b, m);
      col.appendChild(box);
    });
    cols.appendChild(col);
  });
  card.appendChild(cols);

  // placements
  const places=document.createElement('div'); places.className='bkt-places';
  for(let p=1;p<=br.n;p++){
    const part=br.placements[p];
    const overall=br.rankStart-1+p;
    const chip=document.createElement('span');
    if(part && !part.bye){
      chip.className='place-chip';
      chip.innerHTML=`<b>#${overall}</b> <span class="name-link" role="button" tabindex="0" title="Click to see match history" data-player="${escapeHtml(part.name)}">${escapeHtml(part.name)}</span>`;
    }else{
      chip.className='place-chip tbd';
      chip.innerHTML=`<b>#${overall}</b> TBD`;
    }
    places.appendChild(chip);
  }
  card.appendChild(places);
  return card;
}

async function renderBracketStage(){
  const sv=showStageView();
  sv.innerHTML='<div class="loading">Loading brackets\u2026</div>';
  try{
    const {brackets, datesRaw}=await loadBracketData();
    const roundRow=(datesRaw||[]).find(r=>Number(r.Round)===BRACKET_START_ROUND);
    const meta=document.getElementById('roundMeta'); meta.textContent='';
    if(roundRow){
      const a=document.createElement('span'); a.textContent=fmtDateRange(roundRow.Start,roundRow.End)||''; meta.appendChild(a);
    }
    const dot=document.createElement('span'); dot.className='dot'; dot.textContent='Bracket Stage'; meta.appendChild(dot);
    if(TEST_MODE){ const t=document.createElement('span'); t.className='test-note'; t.textContent='TEST DATA'; meta.appendChild(t); }

    sv.innerHTML='';
    const note=document.createElement('p'); note.className='stage-note';
    note.textContent='Winners advance to the next round; first-round losers drop into the back draw. Placement matches decide every final position. Click a player name for their season match history.';
    sv.appendChild(note);
    brackets.forEach(br=> sv.appendChild(renderBracketCard(br)));
  }catch(err){
    console.error(err);
    sv.innerHTML='<div class="error">Could not load bracket data. '+escapeHtml(err.message||'')+'</div>';
  }
}

async function renderFinalStandings(){
  const sv=showStageView();
  sv.innerHTML='<div class="loading">Loading final standings\u2026</div>';
  try{
    const {brackets}=await loadBracketData();
    const fr=BK.finalRankings(brackets);
    const meta=document.getElementById('roundMeta'); meta.textContent='';
    const a=document.createElement('span'); a.textContent='Final standings \u2014 determined by bracket-stage results'; meta.appendChild(a);
    if(TEST_MODE){ const t=document.createElement('span'); t.className='test-note'; t.textContent='TEST DATA'; meta.appendChild(t); }

    sv.innerHTML='';
    if(fr.some(x=>x.pending)){
      const note=document.createElement('p'); note.className='stage-note';
      note.textContent='Some placement matches are still pending \u2014 positions marked TBD will fill in as bracket results are submitted.';
      sv.appendChild(note);
    }
    const panel=document.createElement('div'); panel.className='final-panel';
    fr.forEach(x=>{
      const row=document.createElement('div');
      row.className='final-row'+(x.pending?' pending':'')+((!x.pending&&x.rank<=3)?' podium':'');
      const medal = x.rank===1?'\ud83e\udd47':x.rank===2?'\ud83e\udd48':x.rank===3?'\ud83e\udd49':'';
      const frank=document.createElement('div'); frank.className='frank';
      frank.innerHTML=(medal?`<span class="fmedal">${medal}</span>`:'')+`#${x.rank}`;
      row.appendChild(frank);
      const nm=document.createElement('div'); nm.className='fname';
      if(x.name){
        const s=document.createElement('span'); s.className='name-link'; s.setAttribute('data-player',x.name);
        s.setAttribute('role','button'); s.setAttribute('tabindex','0'); s.title='Click to see match history';
        s.textContent=x.name; nm.appendChild(s);
      } else nm.textContent='TBD';
      row.appendChild(nm);
      const noteEl=document.createElement('div'); noteEl.className='fnote';
      noteEl.textContent=`Bracket ${x.bracket} \u00b7 `+(x.place===1?'Champion':x.place===2?'Runner-up':BK.ordinal(x.place)+' place');
      row.appendChild(noteEl);
      panel.appendChild(row);
    });
    sv.appendChild(panel);
  }catch(err){
    console.error(err);
    sv.innerHTML='<div class="error">Could not load final standings. '+escapeHtml(err.message||'')+'</div>';
  }
}

/* rank/points column helpers */
function colRank(r){ return `R${r}Rank`; }
function colPts(r){ return `R${r}Pts`; }
function readPts(row, r){
  return num(
    row[colPts(r)] ??
    row[`R${r}CPts`] ??
    row[`R${r}Points`] ??
    row[`R${r}CPoints`]
  );
}
function readRank(row, r){
  return num(row[colRank(r)]);
}

/* score text (for display only) */
function hasThirdSetTB(row){ return fmt(row.TB_W) !== '' || fmt(row.TB_O) !== ''; }
function formatThirdEntry(row, perspective){
  if (!hasThirdSetTB(row)){
    const W3 = fmt(row.S3_W), O3 = fmt(row.S3_O);
    if (W3 === '' && O3 === '') return '';
    return perspective === 'winner' ? `${W3}-${O3}` : `${O3}-${W3}`;
  }
  const a = fmt(row.TB_W), b = fmt(row.TB_O);
  if (a === '' && b === '') return '';
  return perspective === 'winner' ? ` ${a}-${b}` : ` ${b}-${a}`;
}
function statusText(row){ return String(row.Status||row.STATUS||'').trim(); }
function isWalkoverStatus(row){ const s=statusText(row).toLowerCase(); return s==='walkover'||s==='wo'||s==='w/o'||s.includes('walkover'); }
function isRetiredStatus(row){ const s=statusText(row).toLowerCase(); return s==='retired'||s==='ret'||s.includes('retired'); }
function resultString(row, perspective, beginRankByName){
  const winner = fmt(row.Winner), opponent = fmt(row.Opponent);
  const wRank = beginRankByName[nameKey(winner)] || '?';
  const oRank = beginRankByName[nameKey(opponent)] || '?';
  const walkover = isWalkoverStatus(row), retired = isRetiredStatus(row);
  let scorePart;
  if (walkover){ scorePart='walkover'; }
  else{
    const W1=fmt(row.S1_W), O1=fmt(row.S1_O);
    const W2=fmt(row.S2_W), O2=fmt(row.S2_O);
    const set1=`${W1}-${O1}`, set2=`${W2}-${O2}`, set3=formatThirdEntry(row, perspective);
    scorePart = (perspective==='winner')
      ? `${set1} ${set2}${set3}` : `${O1}-${W1} ${O2}-${W2}${formatThirdEntry(row,'opponent')}`;
    if (retired) scorePart += ' Ret';
  }
  return (perspective==='winner')
    ? `Beat #${oRank} ${opponent} ${scorePart}`
    : `Lost to #${wRank} ${winner} ${scorePart}`;
}

/* games summary (for modal explanation only) */
function parseGameTotals(row){
  if ('GamesWon' in row && 'GamesLost' in row){
    const w = safeNum(row.GamesWon), o = safeNum(row.GamesLost);
    return { wGames:w, oGames:o, diff: Math.max(0, w - o) };
  }
  const W1=safeNum(row.S1_W), O1=safeNum(row.S1_O);
  const W2=safeNum(row.S2_W), O2=safeNum(row.S2_O);
  const W3=safeNum(row.S3_W), O3=safeNum(row.S3_O);
  const TBW=safeNum(row.TB_W), TBO=safeNum(row.TB_O);
  let wGames = W1 + W2, oGames = O1 + O2;
  if (hasThirdSetTB(row)){
    if (TBW > TBO){ wGames += 1; } else if (TBO > TBW){ oGames += 1; }
  } else if (W3 !== 0 || O3 !== 0){
    wGames += W3; oGames += O3;
  }
  return { wGames, oGames, diff: Math.max(0, wGames - oGames) };
}

/* recent-opponent highlight */
let RECENT_OPP_CACHE_ROUND=null, RECENT_OPP_BY_PLAYER=new Map();
async function buildRecentOpponentsForCurrentRound(){
  if (RECENT_OPP_CACHE_ROUND === CurrentRound) return;
  RECENT_OPP_BY_PLAYER = new Map(); RECENT_OPP_CACHE_ROUND = CurrentRound;
  const start=Math.max(1,CurrentRound-3), end=CurrentRound-1; if(end<1) return;
  const urls=[]; for(let r=start;r<=end;r++) urls.push(CSV[`ScoresRound${r}`]);
  try{
    const rounds = await Promise.all(urls.filter(Boolean).map(loadCSV));
    rounds.flat().forEach(row=>{
      const t=String(row.MatchType||'').trim(); if(t!=='Scheduled'&&t!=='Challenge') return;
      const w=fmt(row.Winner), o=fmt(row.Opponent); if(!w||!o) return;
      const wk=nameKey(w), ok=nameKey(o);
      if(!RECENT_OPP_BY_PLAYER.has(wk)) RECENT_OPP_BY_PLAYER.set(wk,new Set());
      if(!RECENT_OPP_BY_PLAYER.has(ok)) RECENT_OPP_BY_PLAYER.set(ok,new Set());
      RECENT_OPP_BY_PLAYER.get(wk).add(ok); RECENT_OPP_BY_PLAYER.get(ok).add(wk);
    });
  }catch{}
}
function hasPlayedRecently(playerName, oppName){
  const set=RECENT_OPP_BY_PLAYER.get(nameKey(playerName)); return !!(set && set.has(nameKey(oppName)));
}
function appendTextWithHighlight(container, fullText, oppName, hi){
  if (!hi || !oppName){ container.textContent = fullText; return; }
  const hay=String(fullText||''), needle=String(oppName||'');
  const i=hay.toLowerCase().indexOf(needle.toLowerCase());
  if(i<0){ container.textContent=fullText; return; }
  const before=hay.slice(0,i), match=hay.slice(i,i+needle.length), after=hay.slice(i+needle.length);
  container.textContent=''; if(before) container.appendChild(document.createTextNode(before));
  const span=document.createElement('span'); span.className='repeat-opp'; span.textContent=match; container.appendChild(span);
  if(after) container.appendChild(document.createTextNode(after));
}

/* ===== core ===== */
async function init(round){
  ROUND = round;

  const sel=document.getElementById('roundSelect'); if (sel.value !== String(ROUND)) sel.value=String(ROUND);
  const url=new URL(location.href); url.searchParams.set('round',String(ROUND)); history.replaceState(null,'',url);

  // Bracket stage & final standings render in their own view
  if (ROUND === 'final')                      return renderFinalStandings();
  if (Number(ROUND) >= BRACKET_START_ROUND)   return renderBracketStage();

  showLadderView();

  // headings
  document.getElementById('thLeft').textContent  = `Round ${ROUND} Ranking - Points`;
  document.getElementById('thRight').textContent = `Round ${ROUND+1} Ranking - Points`;

  try{
    setStatus('Loading data…'); document.getElementById('ladder').style.display='none'; document.getElementById('status').style.display='';

    if (ROUND === CurrentRound) await buildRecentOpponentsForCurrentRound();

    const roundKey = `ScoresRound${ROUND}`;
    const [playersRaw, scoresRawAll, scheduleRaw, datesRaw] = await Promise.all([
      loadCSV(CSV.Players), loadCSV(CSV[roundKey]), loadCSV(CSV.Schedule), loadCSV(CSV.Dates)
    ]);

    /* meta */
    const roundRow = (datesRaw||[]).find(r => Number(r.Round) === Number(ROUND));
    if (roundRow){
      const meta=document.getElementById('roundMeta'); meta.textContent='';
      const a=document.createElement('span'); a.textContent = fmtDateRange(roundRow.Start, roundRow.End) || ''; meta.appendChild(a);
      const type=fmt(roundRow.Type); if(type){ const dot=document.createElement('span'); dot.className='dot'; dot.textContent=type; meta.appendChild(dot); }
    }

    /* phones + active filter */
    const phoneByName = {};
    const activePlayersRaw = (playersRaw||[]).filter(r=>{
      const start=num(r.RStart), end=num(r.REnd), rr=Number(ROUND);
      return (isNaN(start)||start<=rr) && (isNaN(end)||end>=rr);
    }).map(r=>{
      phoneByName[nameKey(fmt(r.Participant))] = fmt(r.PHONE||r.Phone||r.phone);
      return r;
    });

    /* ranks & points from Players (left = round x, right = round x+1) */
    const players = activePlayersRaw
      .map(r => ({
        Participant: fmt(r.Participant),

        LeftRank:  readRank(r, ROUND),
        LeftPts:   readPts(r, ROUND),

        RightRank: readRank(r, ROUND+1),
        RightPts:  readPts(r, ROUND+1),
      }))
      .filter(p => !isNaN(p.LeftRank) && p.LeftRank > 0)
      .sort((a,b)=>a.LeftRank-b.LeftRank);

    const beginRankByName = {}, nameByBeginRank = {};
    players.forEach(p => {
      beginRankByName[nameKey(p.Participant)] = p.LeftRank;
      nameByBeginRank[p.LeftRank] = p.Participant;
    });

    /* schedule map */
    const scheduleCol = `Round ${ROUND}`;
    const scheduleMap = {};
    (scheduleRaw||[]).forEach(r=>{
      const rnk=Number(r.Ranking), opp=Number(r[scheduleCol]);
      if(!isNaN(rnk)&&!isNaN(opp)) scheduleMap[rnk]=opp;
    });

    /* scores (for result text + modal info; points read directly from CSV) */
    const scoresRaw = (scoresRawAll||[]).filter(r => { const rr=Number(r.Round); return isNaN(rr) || rr===Number(ROUND); });

    const scheduled = new Map();   // nameKey -> matchObj
    const challenges = new Map();  // nameKey -> [matchObj, matchObj]
    const pushChallenge = (k,m)=>{ const arr=challenges.get(k)||[]; if(arr.length<2){arr.push(m);challenges.set(k,arr);} };

    scoresRaw.forEach(r=>{
      const type=String(r.MatchType||'').trim(); if(type!=='Scheduled' && type!=='Challenge') return;
      const winner=fmt(r.Winner), opponent=fmt(r.Opponent); if(!winner||!opponent) return;
      const wKey=nameKey(winner), oKey=nameKey(opponent);
      const wRank=beginRankByName[wKey], oRank=beginRankByName[oKey];

      const { wGames, oGames, diff } = parseGameTotals(r);
      const upset = String(r.Upset||'').toUpperCase() === 'YES' ? 'YES' : 'NO';

      const winObj = {
        text: resultString(r,'winner', beginRankByName),
        isLoss:false, row:r, wRank, oRank, type,
        gw:wGames, gl:oGames, gdiff:diff, upset,
        points: fmtPts(r.WinPoints)
      };
      const loseObj = {
        text: resultString(r,'opponent', beginRankByName),
        isLoss:true, row:r, wRank:oRank, oRank:wRank, type,
        gw:oGames, gl:wGames, gdiff:Math.max(0,oGames-wGames), upset:'NO',
        points: fmtPts(r.LosePoints)
      };

      if (type==='Scheduled'){ scheduled.set(wKey,winObj); scheduled.set(oKey,loseObj); }
      else { pushChallenge(wKey,winObj); pushChallenge(oKey,loseObj); }
    });

    /* table build */
    const tbody=document.getElementById('tbody'); tbody.innerHTML='';

    function makeParticipantCell(playerName, leftRank, leftPts){
      const wrap=document.createElement('div');

      const mHead=document.createElement('div'); mHead.className='m-head';
      const mRank=document.createElement('span'); mRank.className='m-rank'; mRank.textContent=`#${leftRank}`;
      const mName=document.createElement('span'); mName.className='m-name name-link'; mName.textContent=playerName||'';
      mName.setAttribute('data-player', playerName||''); mName.setAttribute('role','button');
      mName.setAttribute('tabindex','0'); mName.title='Tap to see match history';
      mHead.appendChild(mRank); mHead.appendChild(mName);

      // Mobile: Round X points right after player name
      const ptsTxt = (!isNaN(leftPts)) ? fmtPts(leftPts) : '—';
      const mPts=document.createElement('span'); mPts.className='m-pts';
      mPts.innerHTML = `R${ROUND} <b>${ptsTxt}</b> pts`;
      mHead.appendChild(mPts);

      wrap.appendChild(mHead);

      const nameEl=document.createElement('div'); nameEl.className='name name-link'; nameEl.textContent=playerName||'';
      nameEl.setAttribute('data-player', playerName||''); nameEl.setAttribute('role','button');
      nameEl.setAttribute('tabindex','0'); nameEl.title='Click to see match history';
      wrap.appendChild(nameEl);

      // Phone: hidden by default, revealed on click
      const ph=phoneByName[nameKey(playerName)]||'';
      if (ph) {
        const phoneWrap=document.createElement('span'); phoneWrap.className='phone-wrap';
        const toggleBtn=document.createElement('button'); toggleBtn.className='phone-toggle'; toggleBtn.type='button'; toggleBtn.textContent='Show phone';
        const reveal=document.createElement('span'); reveal.className='phone-reveal'; reveal.textContent=ph;
        toggleBtn.addEventListener('click', ()=>{
          const shown = reveal.classList.toggle('shown');
          toggleBtn.textContent = shown ? 'Hide' : 'Show phone';
        });
        phoneWrap.appendChild(toggleBtn); phoneWrap.appendChild(reveal);
        wrap.appendChild(phoneWrap);
      }
      return wrap;
    }

    function appendPointsPill(container, matchObj, chalDiv){
      const btn=document.createElement('button');
      btn.type='button';
      btn.className = matchObj.isLoss ? 'loser-pts' : 'winner-pts';
      btn.setAttribute('data-role', matchObj.isLoss ? 'loser' : 'winner');
      btn.setAttribute('data-points', matchObj.points || '');
      btn.setAttribute('data-upset', matchObj.upset || 'NO');
      btn.setAttribute('data-gw', String(matchObj.gw||0));
      btn.setAttribute('data-gl', String(matchObj.gl||0));
      btn.setAttribute('data-gdiff', String(matchObj.gdiff||0));
      btn.setAttribute('data-wrank', String(matchObj.wRank||''));
      btn.setAttribute('data-orank', String(matchObj.oRank||''));
      if (chalDiv) btn.setAttribute('data-chaldiv', String(chalDiv));
      btn.setAttribute('title', 'Click to see points breakdown');
      btn.innerHTML = `<b>${matchObj.points || ''}</b> pts<span class="pts-hint" aria-hidden="true">?</span>`;
      container.appendChild(btn);
    }

    players.forEach(p=>{
      const tr=document.createElement('tr');
      const meKey=nameKey(p.Participant);

      // Rainbow group: groups of 8, cycling through 7 colours
      const groupNum = Math.ceil(p.LeftRank / 8);
      const groupClass = 'group-' + (((groupNum - 1) % 7) + 1);
      tr.classList.add(groupClass);

      /* col 1: Round X Ranking - Points */
      const tdLeft=document.createElement('td');
      tdLeft.className='rp rp-left';
      tdLeft.innerHTML = `#${p.LeftRank}${(!isNaN(p.LeftPts) ? `<span class="sub">${fmtPts(p.LeftPts)} pts</span>` : `<span class="sub"> </span>`)}`;
      tr.appendChild(tdLeft);

      /* col 2: participant */
      const tdName=document.createElement('td');
      tdName.appendChild(makeParticipantCell(p.Participant, p.LeftRank, p.LeftPts));
      tr.appendChild(tdName);

      /* col 3: results */
      const tdRes=document.createElement('td'); tdRes.className='matches';

      const hasScheduledPlayed = scheduled.has(meKey);

      // scheduled line
      const schedLine=document.createElement('div'); schedLine.className='match-line';
      const sr=scheduled.get(meKey);

      let scheduledOppName='';
      if(sr){ scheduledOppName = sr.isLoss ? fmt(sr.row.Winner) : fmt(sr.row.Opponent); }
      else {
        const oppRank=scheduleMap[p.LeftRank]; scheduledOppName = oppRank ? (nameByBeginRank[oppRank]||'') : '';
      }
      const shouldHi = (ROUND===CurrentRound) && scheduledOppName && hasPlayedRecently(p.Participant, scheduledOppName);

      if(sr){
        const pill=document.createElement('span'); pill.className='badge badge-scheduled'; pill.textContent='S'; schedLine.appendChild(pill);
        const span=document.createElement('span'); span.className='result ' + (sr.isLoss?'lost':'won');
        appendTextWithHighlight(span, sr.text, scheduledOppName, shouldHi);
        schedLine.appendChild(span);
        if (sr.points) appendPointsPill(schedLine, sr, null);
      }else{
        const oppRank=scheduleMap[p.LeftRank];
        if(oppRank){
          const oppName=nameByBeginRank[oppRank]||'';
          const pill=document.createElement('span'); pill.className='badge badge-scheduled'; pill.textContent='S'; schedLine.appendChild(pill);
          const pre=document.createElement('span'); pre.textContent=`#${oppRank} `; schedLine.appendChild(pre);
          const nameSpan=document.createElement('span'); if(shouldHi) nameSpan.className='repeat-opp'; nameSpan.textContent=oppName; schedLine.appendChild(nameSpan);
          // Pending indicator
          const pend=document.createElement('span'); pend.className='pending'; pend.textContent=' — pending'; schedLine.appendChild(pend);
        }else{
          schedLine.classList.add('empty'); schedLine.innerHTML='&nbsp;';
        }
      }
      tdRes.appendChild(schedLine);

      // challenge lines
      const myChals=challenges.get(meKey)||[];
      for(let i=0;i<2;i++){
        const line=document.createElement('div'); line.className='match-line';
        const cr=myChals[i];
        if(cr){
          const pill=document.createElement('span'); pill.className='badge badge-challenge'; pill.textContent='C'; line.appendChild(pill);
          const span=document.createElement('span'); span.className='result ' + (cr.isLoss?'lost':'won'); span.textContent=cr.text; line.appendChild(span);
          const chalDiv = hasScheduledPlayed ? 2 : 4;
          if (cr.points) appendPointsPill(line, cr, chalDiv);
        }else{
          line.classList.add('empty'); line.innerHTML='&nbsp;';
        }
        tdRes.appendChild(line);
      }

      // Mobile bottom row: Round X+1 rank and points
      const mStats=document.createElement('div'); mStats.className='m-stats';
      const rightRankTxt = (!isNaN(p.RightRank) && p.RightRank>0) ? `#${p.RightRank}` : '—';
      const rightPtsTxt  = (!isNaN(p.RightPts)) ? fmtPts(p.RightPts) : '—';
      mStats.innerHTML = `R${ROUND+1}: <b>${rightRankTxt}</b> / <b>${rightPtsTxt}</b> pts`;
      tdRes.appendChild(mStats);

      tr.appendChild(tdRes);

      /* col 4: Round X+1 Ranking - Points with movement arrow */
      const tdRight=document.createElement('td');
      tdRight.className='rp right rp-right';

      const hasRight = !isNaN(p.RightRank) && p.RightRank > 0;
      const rankText = hasRight ? `#${p.RightRank}` : '';
      const ptsText  = (!isNaN(p.RightPts)) ? `${fmtPts(p.RightPts)} pts` : '';

      let moveHtml = '';
      if (hasRight) {
        const diff = p.LeftRank - p.RightRank; // positive = moved up (lower rank number)
        if (diff > 0)       moveHtml = `<span class="move move-up">↑${diff}</span>`;
        else if (diff < 0)  moveHtml = `<span class="move move-down">↓${Math.abs(diff)}</span>`;
        else                moveHtml = `<span class="move move-same">—</span>`;
      }

      tdRight.innerHTML = `${rankText || '&nbsp;'}${moveHtml}<span class="sub">${ptsText || '&nbsp;'}</span>`;
      tr.appendChild(tdRight);

      tbody.appendChild(tr);
    });

    document.getElementById('ladder').style.display=''; document.getElementById('status').style.display='none'; setStatus('');
  }catch(err){
    console.error(err);
    setStatus('There was a problem loading your data. Double-check the CSV links and headers.', true);
  }
}

/* round picker */
function buildRoundSelect(){
  const sel=document.getElementById('roundSelect'); sel.innerHTML='';
  const maxNumbered=Math.min(CurrentRound, BRACKET_START_ROUND);
  for(let r=1;r<=maxNumbered;r++){
    const opt=document.createElement('option'); opt.value=String(r);
    opt.textContent = (r>=BRACKET_START_ROUND) ? `Round ${r} \u2013 Brackets` : `Round ${r}`;
    sel.appendChild(opt);
  }
  if (CurrentRound>=BRACKET_START_ROUND+1){
    const opt=document.createElement('option'); opt.value='final'; opt.textContent='Final Standings'; sel.appendChild(opt);
  }
  sel.value=String(ROUND);
  if (!sel.dataset.bound){
    sel.dataset.bound='1';
    sel.addEventListener('change',()=>{
      const v=sel.value;
      if (v==='final'){ init('final'); return; }
      const r=parseInt(v,10); if(!isNaN(r)&&r>=1) init(r);
    });
  }
}

/* modal – restored explanatory text (no in-page calculation of points) */
const backdropEl=document.getElementById('backdrop'); const modalEl=document.getElementById('modal');
const modalBody=document.getElementById('modalBody'); const modalTitle=document.getElementById('modalTitle');
document.getElementById('modalClose').addEventListener('click', closeModal); backdropEl.addEventListener('click', closeModal);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
function openModal(title, html){ modalTitle.textContent=title||'Info'; modalBody.innerHTML=html; backdropEl.classList.add('show'); modalEl.classList.add('show'); document.documentElement.style.overflow='hidden'; document.body.style.overflow='hidden'; }
function closeModal(){ modalEl.classList.remove('show'); backdropEl.classList.remove('show'); document.documentElement.style.overflow=''; document.body.style.overflow=''; }

function handlePointsClick(e){
  const loserBtn = e.target.closest('.loser-pts');
  const winnerBtn = e.target.closest('.winner-pts');
  if (!loserBtn && !winnerBtn) return;

  e.preventDefault();
  e.stopPropagation();

  if (loserBtn){
    const pts = loserBtn.getAttribute('data-points') || '';
    const gw = loserBtn.getAttribute('data-gw') || '0';
    const div = loserBtn.getAttribute('data-chaldiv') || '';
    const isChallenge = !!div;

    const html = `
      <p><strong>Points (from CSV):</strong> ${pts}</p>
      <p><strong>Total games won:</strong> ${gw}</p>
      ${isChallenge ? `
        <p><strong>Challenge divisor used:</strong> ${div}</p>
        <p class="tip">Challenge points are divided by 2 when the scheduled match is played; divided by 4 when it is not played.</p>
      ` : ''}
      <p class="tip">Loser points are equal to games won (capped at 10). Values shown here are read directly from <em>LosePoints</em> in the Scores CSV.</p>
    `;
    openModal('Loser Points', html);
    return;
  }

  if (winnerBtn){
    const pts = winnerBtn.getAttribute('data-points') || '';
    const upset = (winnerBtn.getAttribute('data-upset') || 'NO').toUpperCase();
    const gw = winnerBtn.getAttribute('data-gw') || '0';
    const gl = winnerBtn.getAttribute('data-gl') || '0';
    const gd = winnerBtn.getAttribute('data-gdiff') || '0';
    const wr = winnerBtn.getAttribute('data-wrank') || '';
    const orr = winnerBtn.getAttribute('data-orank') || '';
    const rdiff = (wr && orr) ? Math.abs(Number(wr)-Number(orr)) : '';
    const div = winnerBtn.getAttribute('data-chaldiv') || '';
    const isChallenge = !!div;

    const topAlert = (upset === 'YES') ? `<p><strong>UPSET ALERT!</strong></p>` : '';
    const body = (upset === 'YES')
      ? `
        <p><strong>Points:</strong> ${pts}</p>
        <p><strong>Games won:</strong> ${gw}, <strong>Games lost:</strong> ${gl}, <strong>Diff:</strong> ${gd}</p>
        <p><strong>Your Rank:</strong> ${wr}, <strong>Opponent Rank:</strong> ${orr}, <strong>Rank diff:</strong> ${rdiff}</p>
        ${isChallenge ? `
          <p><strong>Challenge divisor used:</strong> ${div}</p>
          <p class="tip">Challenge points are divided by 2 when the scheduled match is played; divided by 4 when it is not played.</p>
        ` : ''}
        <p class="tip">Upset winners are normally: <code>10 + (game diff × rank diff / 2)</code>, min 15, max 25.</p>
      `
      : `
        <p><strong>Points:</strong> ${pts}</p>
        <p><strong>Games won:</strong> ${gw}, <strong>Games lost:</strong> ${gl}, <strong>Diff:</strong> ${gd}</p>
        ${isChallenge ? `
          <p><strong>Challenge divisor used:</strong> ${div}</p>
          <p class="tip">Challenge points are divided by 2 when the scheduled match is played; divided by 4 when it is not played.</p>
        ` : ''}
        <p class="tip">Non-upset winners are normally: <code>10 + (game diff)</code>, minimum 11.</p>
      `;

    openModal('Winner Points', `${topAlert}${body}`);
  }
}
document.addEventListener('click', handlePointsClick, {capture:false});
document.addEventListener('pointerup', handlePointsClick, {capture:false});

/* ===== Player match history ===== */
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* caches so repeat clicks don't refetch */
const _scoresCache = new Map();   // round -> rows
let _playersCache = null;
async function getScoresFor(r){
  if(_scoresCache.has(r)) return _scoresCache.get(r);
  const url = CSV[`ScoresRound${r}`];
  const rows = url ? await loadCSV(url).catch(()=>[]) : [];
  _scoresCache.set(r, rows);
  return rows;
}
async function getPlayersRows(){
  if(_playersCache) return _playersCache;
  _playersCache = await loadCSV(CSV.Players).catch(()=>[]);
  return _playersCache;
}
/* begin-of-round rank map for round r, using the R{r}Rank column */
function rankMapForRound(playersRows, r){
  const m={};
  (playersRows||[]).forEach(row=>{
    const nm=fmt(row.Participant); if(!nm) return;
    const rk=num(row[`R${r}Rank`]);
    if(!isNaN(rk)) m[nameKey(nm)]=rk;
  });
  return m;
}

async function showPlayerHistory(playerName){
  // prior rounds only (viewing R3 -> show R1, R2); bracket & final views show rounds 1-5
  const upTo = (ROUND==='final' ? BRACKET_START_ROUND : Number(ROUND)) - 1;
  openModal(`${playerName} — Match History`, `<p class="tip">Loading…</p>`);

  if (upTo < 1){
    modalBody.innerHTML = `<p>No prior rounds yet — this is Round ${ROUND}.</p>`;
    return;
  }

  try{
    const playersRows = await getPlayersRows();
    let html = '';
    let totalMatches = 0;

    for(let r=1; r<=upTo; r++){
      const scores = await getScoresFor(r);
      const ranks  = rankMapForRound(playersRows, r);

      const mine = (scores||[]).filter(row=>{
        const t=String(row.MatchType||'').trim();
        if(t!=='Scheduled' && t!=='Challenge') return false;
        const rr=Number(row.Round);
        if(!isNaN(rr) && rr!==r) return false;
        return nameKey(row.Winner)===nameKey(playerName) || nameKey(row.Opponent)===nameKey(playerName);
      });
      if(!mine.length) continue;

      // Scheduled first, then challenges
      mine.sort((a,b)=>{
        const ta=String(a.MatchType||'').trim(), tb=String(b.MatchType||'').trim();
        if(ta===tb) return 0; return ta==='Scheduled' ? -1 : 1;
      });

      let rowsHtml='';
      mine.forEach(row=>{
        const isWinner = nameKey(row.Winner)===nameKey(playerName);
        const text = resultString(row, isWinner ? 'winner' : 'opponent', ranks);
        const type = String(row.MatchType||'').trim();
        const badgeClass = type==='Challenge' ? 'badge-challenge' : 'badge-scheduled';
        const badgeTxt   = type==='Challenge' ? 'C' : 'S';
        const resultClass= isWinner ? 'won' : 'lost';
        const pts = isWinner ? fmtPts(row.WinPoints) : fmtPts(row.LosePoints);
        const ptsHtml = pts ? ` <span class="hist-pts">${pts} pts</span>` : '';
        rowsHtml += `<div class="hist-match"><span class="badge ${badgeClass}">${badgeTxt}</span>`
                 +  `<span class="result ${resultClass}">${escapeHtml(text)}</span>${ptsHtml}</div>`;
        totalMatches++;
      });

      html += `<div class="hist-round"><div class="hist-round-title">Round ${r}</div>${rowsHtml}</div>`;
    }

    if(!totalMatches){
      html = `<p class="hist-empty">No recorded matches for ${escapeHtml(playerName)} in Round${upTo>1?'s':''} 1${upTo>1?`–${upTo}`:''}.</p>`;
    }
    modalBody.innerHTML = html;
  }catch(err){
    console.error(err);
    modalBody.innerHTML = `<p>Sorry — couldn't load match history. Please try again.</p>`;
  }
}

/* open history on name click (and keyboard activation) */
document.addEventListener('click', e=>{
  const link = e.target.closest('.name-link');
  if(!link) return;
  const name = link.getAttribute('data-player')||'';
  if(name) showPlayerHistory(name);
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const link = e.target.closest && e.target.closest('.name-link');
  if(!link) return;
  e.preventDefault();
  const name = link.getAttribute('data-player')||'';
  if(name) showPlayerHistory(name);
});


/* boot */
(async function boot(){
  await fetchCurrentRound();
  if (TEST_MODE) CurrentRound = Math.max(CurrentRound, BRACKET_START_ROUND+1);
  ROUND = computeRoundFromURL();
  buildRoundSelect();
  init(ROUND);
})();

/* Re-fetch fresh data when the user returns to this tab after being away */
let _lastVisible = Date.now();
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'hidden') { _lastVisible = Date.now(); return; }
  const away = Date.now() - _lastVisible;
  if (away < 60000) return; // skip if away less than 60 s
  _lastVisible = Date.now();
  _scoresCache.clear(); _playersCache = null; // refresh history data too
  const prevRound = CurrentRound;
  await fetchCurrentRound();
  if (TEST_MODE) CurrentRound = Math.max(CurrentRound, BRACKET_START_ROUND+1);
  if (CurrentRound !== prevRound) buildRoundSelect();
  init(ROUND);
});
</script>
</body>
