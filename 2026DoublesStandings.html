<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>2026 IndyTennis Doubles Ladder</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#0b0e14; --panel:#11161f; --muted:#8ea0b4; --text:#e9eef5; --rule:#253043;
    --accent:#ffb347; --accent-ink:#3a1f00; --ok:#3bd37f; --bad:#ff6b6b;
    --chip:#1a2332; --chipBorder:#2a364a; --chipBlue:#173049; --chipBlueBorder:#284564;
    --chipPurple:#251e42; --chipPurpleBorder:#3b2f6a; --shadow: 0 20px 60px rgba(0,0,0,.45);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  html,body{background:linear-gradient(180deg,#0b0e14, #0b0e14 180px, #0d121b 100%); color:var(--text); min-height:100%;}
  body{ margin:24px; display:flex; justify-content:center; }
  .wrap{ width:100%; max-width:1200px; }

  /* ===== HEADER ===== */
  header{ background:linear-gradient(180deg,#0f1521,#0d131e); border:1px solid var(--rule);
    border-radius:14px; padding:18px 18px 14px; box-shadow: var(--shadow);}
  .title{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;}
  .title h1{ font-size:22px; margin:0; letter-spacing:.2px;}
  .title .doubles-badge{ background:#2a1a00; border:1px solid #5a3a00; color:var(--accent); font-size:12px; font-weight:800;
    padding:3px 10px; border-radius:999px; letter-spacing:.05em; text-transform:uppercase; }
  .round-select-wrap{ position:relative; display:inline-block; }
  .round-select-wrap::after{ content:'▾'; position:absolute; right:10px; top:50%; transform:translateY(-50%);
    color:var(--muted); font-size:11px; pointer-events:none; }
  .round-select{ appearance:none; font-size:12px; padding:6px 26px 6px 10px; border-radius:999px;
    background:var(--chip); border:1px solid var(--chipBorder); color:var(--muted); cursor:pointer; }
  .meta{ margin-top:8px; color:var(--muted); font-size:14px; display:flex; gap:10px; flex-wrap:wrap;}
  .meta .dot::before{content:"•"; margin:0 8px; color:#3a4b66;}

  /* ===== DESKTOP TABLE ===== */
  .panel{ margin-top:18px; background:var(--panel); border:1px solid var(--rule); border-radius:12px; overflow:auto; -webkit-overflow-scrolling:touch; }
  table{ width:100%; min-width:1040px; border-collapse:collapse; font-size:14px; table-layout:auto; }
  thead th{ text-align:left; font-weight:600; color:#b9c6d8; background:#0f1521; border-bottom:1px solid var(--rule);
    padding:12px; position:sticky; top:0; z-index:2; box-shadow:0 2px 0 0 var(--rule); white-space:nowrap; }
  tbody td{ border-bottom:1px solid var(--rule); padding:12px; vertical-align:middle; white-space:nowrap; }
  tbody tr:hover{ background:rgba(255,255,255,.03); }
  tbody tr.group-1{ border-left:3px solid rgba(255,80,80,.75);   background:rgba(255,80,80,.04); }
  tbody tr.group-2{ border-left:3px solid rgba(255,150,30,.75);  background:rgba(255,150,30,.04); }
  tbody tr.group-3{ border-left:3px solid rgba(255,220,0,.75);   background:rgba(255,220,0,.04); }
  tbody tr.group-4{ border-left:3px solid rgba(60,200,80,.75);   background:rgba(60,200,80,.04); }
  tbody tr.group-5{ border-left:3px solid rgba(30,180,200,.75);  background:rgba(30,180,200,.04); }
  tbody tr.group-6{ border-left:3px solid rgba(80,120,255,.75);  background:rgba(80,120,255,.04); }
  tbody tr.group-7{ border-left:3px solid rgba(160,60,220,.75);  background:rgba(160,60,220,.04); }
  tbody tr:hover{ background:rgba(255,255,255,.06) !important; }

  .rp{ width:210px; color:#cdd8e6; font-variant-numeric:tabular-nums; }
  .rp .sub{ display:block; margin-top:4px; font-size:12px; color:var(--muted); font-weight:600; }
  .rp.right{ width:260px; }
  .move{ display:inline-block; font-size:11px; font-weight:800; padding:1px 6px; border-radius:999px; margin-left:6px; vertical-align:middle; }
  .move-up{   background:rgba(59,211,127,.15); color:#3bd37f; }
  .move-down{ background:rgba(255,107,107,.15); color:#ff6b6b; }
  .move-same{ background:rgba(255,255,255,.06); color:#6e7f98; }
  .team-cell{ min-width:220px; }
  .team-name{ font-weight:800; color:#e9eef5; }
  .player-row{ display:flex; align-items:center; gap:8px; margin-top:4px; flex-wrap:wrap; }
  .player-label{ font-size:12px; font-weight:600; color:#b9c6d8; }

  /* Phone reveal */
  .phone-wrap{ display:inline-block; }
  .phone-toggle{ background:none; border:none; padding:0; cursor:pointer; font-size:12px; color:#3a4f6a; font-weight:600; transition:color .15s; }
  .phone-toggle:hover{ color:var(--muted); }
  .phone-reveal{ font-size:12px; font-weight:600; color:var(--muted); letter-spacing:.2px; display:none; }
  .phone-reveal.shown{ display:inline; }

  .result{ font-weight:600; }
  .won{ color:var(--ok); }
  .lost{ color:var(--bad); }
  .pending{ color:#3a4f6a; font-style:italic; font-size:13px; }
  .loading,.error{ margin:22px 0; padding:14px 16px; border-radius:10px; background:#0f1521; border:1px solid var(--rule); color:#8ea0b4; }

  .badge{ display:inline-block; padding:2px 8px; border-radius:999px; border:1px solid var(--chipBorder);
    background:var(--chip); color:var(--muted); font-size:12px; margin-right:8px; white-space:nowrap; flex:0 0 auto; }
  .badge-scheduled{ background:var(--chipBlue); border-color:var(--chipBlueBorder); }
  .badge-challenge{ background:var(--chipPurple); border-color:var(--chipPurpleBorder); }

  .winner-pts,.loser-pts{
    display:inline-flex; align-items:center; gap:5px; margin-left:10px; padding:2px 8px 2px 6px;
    border-radius:999px; font-size:12px; cursor:pointer; user-select:none;
    position:relative; z-index:3; pointer-events:auto; white-space:nowrap;
    transition:filter .15s, transform .1s;
  }
  .winner-pts:hover,.loser-pts:hover{ filter:brightness(1.25); transform:scale(1.04); }
  .loser-pts{ background:#1a2230; border:1px solid #2a3548; color:#bcd0e5; }
  .winner-pts{ background:#12261b; border:1px solid #284c37; color:#c9edd7; }
  .loser-pts b,.winner-pts b{ font-variant-numeric:tabular-nums; color:#e9eef5; }
  .pts-hint{ font-size:10px; opacity:.55; margin-left:1px; }

  .matches{ white-space:nowrap; min-width:460px; }
  .match-line{ display:flex; align-items:center; gap:8px; min-height:26px; flex-wrap:wrap; }
  .match-line.empty{ opacity:0; min-height:26px; }
  .repeat-opp{ background:#fff200; color:#000; padding:1px 6px; border-radius:8px; font-weight:900; box-shadow:0 0 0 1px rgba(0,0,0,.35) inset; }

  /* ===== MODAL ===== */
  .backdrop{ position:fixed; inset:0; background:rgba(8,12,20,.55); opacity:0; pointer-events:none; transition:opacity .15s ease; z-index:10000; }
  .backdrop.show{ opacity:1; pointer-events:auto; }
  .modal{ position:fixed; left:50%; top:50%; transform:translate(-50%,-46%) scale(.98); background:#0f1521; border:1px solid var(--rule);
    border-radius:16px; box-shadow:var(--shadow); width:min(92vw,560px); opacity:0; transition:opacity .15s ease, transform .18s ease; z-index:10001; }
  .modal.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--rule);
    background:#11192a; border-top-left-radius:16px; border-top-right-radius:16px; }
  .modal-title{ font-weight:700; font-size:18px; }
  .modal-close{ appearance:none; border:1px solid #334258; background:#1a2436; color:#c9d6e6; border-radius:8px; width:28px; height:28px;
    font-size:16px; line-height:26px; text-align:center; cursor:pointer; }
  .modal-body{ padding:16px; color:#d2deee; }
  .modal-body p{ margin:0 0 8px 0; line-height:1.5; }
  .modal-body .tip{ margin-top:10px; font-size:13px; color:#93a6bf; border-top:1px dashed #2a3750; padding-top:10px; }

  /* ===== MOBILE CARDS =====
     On narrow screens the table is hidden; we render stacked cards instead.
     Each card shows: rank + team name + R1 pts / phones / matches / R2 strip */
  .mobile-list{ display:none; margin-top:18px; }

  .m-card{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:12px;
    margin-bottom:10px;
    overflow:hidden;
    border-left-width:4px;
    border-left-style:solid;
    border-left-color:#3a4f6a; /* overridden per-card by JS */
  }
  .m-card-inner{ padding:14px 14px 10px; }

  /* Row 1: rank number + team name + pts pill */
  .m-top{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .m-rank{ font-size:20px; font-weight:900; color:#cdd8e6; font-variant-numeric:tabular-nums; flex-shrink:0; min-width:36px; }
  .m-team-name{ font-size:15px; font-weight:800; color:#e9eef5; flex:1; min-width:0; }
  .m-pts-pill{
    font-size:12px; font-weight:800; color:#cdd8e6;
    padding:3px 10px; border-radius:999px;
    background:#101827; border:1px solid #253043;
    white-space:nowrap; flex-shrink:0;
  }
  .m-pts-pill b{ color:#e9eef5; font-variant-numeric:tabular-nums; }

  /* Row 2: phone numbers */
  .m-phones{
    display:flex; gap:14px; flex-wrap:wrap;
    padding:6px 0 10px;
    margin-bottom:10px;
    border-bottom:1px solid var(--rule);
  }
  .m-phone-item{ display:flex; align-items:center; gap:6px; }
  .m-phone-label{ font-size:12px; color:#b9c6d8; font-weight:600; }

  /* Match lines */
  .m-matches{ display:flex; flex-direction:column; gap:8px; }
  .m-match-line{
    display:flex; align-items:flex-start; gap:8px; flex-wrap:wrap;
    font-size:13px; line-height:1.5;
  }
  .m-match-line .badge{ margin-right:0; flex-shrink:0; }
  .m-match-line .winner-pts,
  .m-match-line .loser-pts{ margin-left:0; margin-top:2px; }

  /* Bottom strip: next-round rank + movement */
  .m-bottom{
    background:#0d121b;
    border-top:1px solid var(--rule);
    padding:8px 14px;
    font-size:12px;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .m-bottom b{ color:#e9eef5; font-variant-numeric:tabular-nums; }

  /* ===== BRACKET STAGE (top 4 only, rounds 5–6) ===== */
  .bracket-card{ margin-top:18px; background:var(--panel); border:1px solid var(--rule); border-radius:12px;
    padding:14px; box-shadow:var(--shadow); }
  .bracket-head{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .bracket-head h2{ margin:0; font-size:18px; letter-spacing:.2px; }
  .bracket-sub{ color:var(--muted); font-size:13px; }
  .stage-note{ margin:0 0 14px; color:var(--muted); font-size:13px; line-height:1.5; }
  .bkt-cols{ display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch; }
  .bkt-col{ min-width:260px; flex:1 1 260px; display:flex; flex-direction:column; gap:10px; }
  .bkt-col-title{ font-size:11px; font-weight:800; letter-spacing:.6px; text-transform:uppercase;
    color:#b9c6d8; padding-bottom:5px; border-bottom:1px solid var(--rule); }
  .bkt-m{ background:#0e1420; border:1px solid var(--rule); border-radius:10px; padding:8px 10px; font-size:13px; }
  .bkt-m-title{ color:var(--muted); font-size:11px; font-weight:700; margin-bottom:6px;
    display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .bkt-line{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:2px 0; min-width:0; }
  .bkt-name{ font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .bkt-name .sd{ color:var(--muted); font-weight:600; margin-right:6px; font-variant-numeric:tabular-nums; font-size:12px; }
  .bkt-win{ color:var(--ok); }
  .bkt-lose{ color:#8ea0b4; }
  .bkt-tbd{ color:#5b6c85; font-style:italic; font-weight:600; }
  .bkt-score{ color:#b9c6d8; font-variant-numeric:tabular-nums; white-space:nowrap; font-size:12px; }
  .bkt-phones{ display:flex; gap:12px; flex-wrap:wrap; padding:1px 0 4px; }
  .bkt-phone-item{ display:flex; align-items:center; gap:5px; }
  .bkt-phone-item .player-label{ font-size:11px; color:#5b6c85; }
  .bkt-tag{ font-size:10px; font-weight:800; border-radius:999px; padding:1px 7px; white-space:nowrap; }
  .bkt-tag.ready{ background:rgba(245,166,35,.15); color:#f5a623; }
  .bkt-tag.done{ background:rgba(59,211,127,.15); color:var(--ok); }
  .bkt-tag.wait{ background:rgba(255,255,255,.06); color:#6e7f98; }
  .bkt-places{ margin-top:14px; padding-top:12px; border-top:1px dashed #2a3750;
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .bkt-places-label{ font-size:11px; font-weight:800; letter-spacing:.6px; text-transform:uppercase;
    color:#b9c6d8; margin-right:2px; }
  .place-chip{ font-size:12px; background:#101827; border:1px solid #253043; border-radius:999px;
    padding:3px 10px; color:#cdd8e6; font-variant-numeric:tabular-nums; }
  .place-chip b{ color:#e9eef5; }
  .place-chip.tbd{ opacity:.55; font-style:italic; }
  .ladder-heading{ margin:22px 0 0; font-size:15px; color:#b9c6d8; letter-spacing:.2px; }
  .ladder-heading span{ color:var(--muted); font-size:13px; font-weight:400; margin-left:8px; }
  .in-bracket{ color:#5b6c85; font-style:italic; font-size:13px; }

  @media (max-width:720px){
    body{ margin:12px; }
    .panel{ display:none; }
    .mobile-list{ display:block; }
    .bkt-cols{ flex-direction:column; }
    .bkt-col{ max-width:none; min-width:0; flex:1 1 auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1>IndyTennis Doubles Ladder</h1>
      <span class="doubles-badge">Doubles</span>
      <div class="round-select-wrap">
        <select id="roundSelect" class="round-select" aria-label="Select round"></select>
      </div>
    </div>
    <div class="meta" id="roundMeta"></div>
  </header>

  <!-- Bracket stage (top 4 only, rounds 5–6) -->
  <div id="bracketView"></div>
  <div id="ladderHeading"></div>

  <!-- Desktop table -->
  <div class="panel">
    <div class="loading" id="status">Loading data…</div>
    <table id="ladder" style="display:none;">
      <thead>
        <tr>
          <th class="rp" id="thLeft">Round 1 Ranking - Points</th>
          <th>Team</th>
          <th class="matches">Result</th>
          <th class="rp right" id="thRight">Round 2 Ranking - Points</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <!-- Mobile card list -->
  <div class="mobile-list" id="mobileList"></div>
</div>

<div class="backdrop" id="backdrop" aria-hidden="true"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-header">
    <div class="modal-title" id="modalTitle">Info</div>
    <button class="modal-close" id="modalClose" aria-label="Close">×</button>
  </div>
  <div class="modal-body" id="modalBody"></div>
</div>

<script>
/* ===== CONFIG ===== */
const CURRENT_ROUND_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRPNHB3kzdNUyzMoQtiWkmnb4OiSqoUO9x8avI3ceYSvmXmdZYr0OxCyJ6wkPW8ftIBk-bW4QW5UkIh/pub?gid=972964638&single=true&output=csv';
let CurrentRound = 1;
const CSV = {
  Players:     'https://docs.google.com/spreadsheets/d/e/2PACX-1vRPNHB3kzdNUyzMoQtiWkmnb4OiSqoUO9x8avI3ceYSvmXmdZYr0OxCyJ6wkPW8ftIBk-bW4QW5UkIh/pub?gid=0&single=true&output=csv',
  Schedule:    'https://docs.google.com/spreadsheets/d/e/2PACX-1vRPNHB3kzdNUyzMoQtiWkmnb4OiSqoUO9x8avI3ceYSvmXmdZYr0OxCyJ6wkPW8ftIBk-bW4QW5UkIh/pub?gid=1596015267&single=true&output=csv',
  Dates:       'https://docs.google.com/spreadsheets/d/e/2PACX-1vRPNHB3kzdNUyzMoQtiWkmnb4OiSqoUO9x8avI3ceYSvmXmdZYr0OxCyJ6wkPW8ftIBk-bW4QW5UkIh/pub?gid=838168726&single=true&output=csv',
  ScoresRound1:'https://docs.google.com/spreadsheets/d/e/2PACX-1vRPNHB3kzdNUyzMoQtiWkmnb4OiSqoUO9x8avI3ceYSvmXmdZYr0OxCyJ6wkPW8ftIBk-bW4QW5UkIh/pub?gid=1813586077&single=true&output=csv',
  ScoresRound2:'https://docs.google.com/spreadsheets/d/e/2PACX-1vRPNHB3kzdNUyzMoQtiWkmnb4OiSqoUO9x8avI3ceYSvmXmdZYr0OxCyJ6wkPW8ftIBk-bW4QW5UkIh/pub?gid=667416587&single=true&output=csv',
  ScoresRound3:'https://docs.google.com/spreadsheets/d/e/2PACX-1vRPNHB3kzdNUyzMoQtiWkmnb4OiSqoUO9x8avI3ceYSvmXmdZYr0OxCyJ6wkPW8ftIBk-bW4QW5UkIh/pub?gid=1340896382&single=true&output=csv',
  ScoresRound4:'https://docs.google.com/spreadsheets/d/e/2PACX-1vRPNHB3kzdNUyzMoQtiWkmnb4OiSqoUO9x8avI3ceYSvmXmdZYr0OxCyJ6wkPW8ftIBk-bW4QW5UkIh/pub?gid=1779797386&single=true&output=csv',
  ScoresRound5:'https://docs.google.com/spreadsheets/d/e/2PACX-1vRPNHB3kzdNUyzMoQtiWkmnb4OiSqoUO9x8avI3ceYSvmXmdZYr0OxCyJ6wkPW8ftIBk-bW4QW5UkIh/pub?gid=1138515130&single=true&output=csv',
  /* ⚠️ VERIFY THIS GID. Every other doubles gid matches the singles workbook exactly,
     so this uses the singles "Round 6 Scores" gid. Publish the doubles Round 6 Scores
     tab to CSV (File ▸ Share ▸ Publish to web) and paste the real gid here if it differs. */
  ScoresRound6:'https://docs.google.com/spreadsheets/d/e/2PACX-1vRPNHB3kzdNUyzMoQtiWkmnb4OiSqoUO9x8avI3ceYSvmXmdZYr0OxCyJ6wkPW8ftIBk-bW4QW5UkIh/pub?gid=2117392535&single=true&output=csv',
};
let ROUND = 1;

/* ===== BRACKET STAGE CONFIG =====
   Top 4 teams (seeded by their R5 ranking) play a 4-team bracket:
     Round 5 → Semifinal 1 (#1 v #4), Semifinal 2 (#2 v #3)
     Round 6 → Final (SF winners) and 3rd-Place Match (SF losers)
   Ranks 5+ keep playing the normal ladder in both rounds.

   Enter bracket scores in the ordinary Round 5 / Round 6 Scores tabs.
   Set MatchType to "Bracket" (or Semifinal / Final / 3rd Place) so the rows
   are kept out of the regular ladder result lines. If a bracket row is
   mistakenly typed as "Scheduled", the bracket still picks it up as a
   fallback — the pairing is what identifies the match. */
const BRACKET_START_ROUND = 5;  // semifinals played this round
const BRACKET_FINAL_ROUND = 6;  // final + 3rd-place match played this round
const BRACKET_TEAMS       = 4;  // top N teams enter the bracket
const BRACKET_TYPE_RE = /bracket|semi|final|3rd|third|place/i;
const inBracketRound = r => Number(r) === BRACKET_START_ROUND || Number(r) === BRACKET_FINAL_ROUND;

/* ===== BRACKET ENGINE (4-team, single elimination + 3rd-place match) ===== */
const BK = (function(){
  'use strict';
  const bkFmt = v => (v===undefined||v===null) ? '' : String(v).trim();
  const bkKey = s => bkFmt(s).toLowerCase();
  const pairKey = (a,b) => { const x=bkKey(a), y=bkKey(b); return x<y ? x+'|'+y : y+'|'+x; };

  /* seeded = [{name, seed}] ordered 1..4 (seed = R5 ladder rank) */
  function build(seeded){
    const S = n => seeded[n-1] || null;
    const sf1 = { code:'SF1', title:'Semifinal 1', round:BRACKET_START_ROUND,
                  a:S(1), b:S(4), src:null };
    const sf2 = { code:'SF2', title:'Semifinal 2', round:BRACKET_START_ROUND,
                  a:S(2), b:S(3), src:null };
    const fin = { code:'F',   title:'Final', round:BRACKET_FINAL_ROUND,
                  a:null, b:null, decides:[1,2],
                  src:[{from:sf1,take:'winner'},{from:sf2,take:'winner'}] };
    const thd = { code:'3P',  title:'3rd-Place Match', round:BRACKET_FINAL_ROUND,
                  a:null, b:null, decides:[3,4],
                  src:[{from:sf1,take:'loser'},{from:sf2,take:'loser'}] };
    const matches=[sf1,sf2,fin,thd];
    matches.forEach(m=>{ m.done=false; m.ready=false; m.winner=null; m.loser=null; m.row=null; });
    return { matches, sf1, sf2, fin, thd, seeded };
  }

  function srcDesc(s){ return s ? ((s.take==='winner'?'Winner of ':'Loser of ')+s.from.code) : 'TBD'; }

  /* rowsByPair: Map(pairKey -> score row). Loops until stable, so the order
     results are entered in never matters. */
  function resolve(br, rowsByPair){
    let changed=true;
    while(changed){
      changed=false;
      for(const m of br.matches){
        if(m.done) continue;
        if(m.src){
          const [sa,sb]=m.src;
          m.a = sa.from.done ? (sa.take==='winner'?sa.from.winner:sa.from.loser) : null;
          m.b = sb.from.done ? (sb.take==='winner'?sb.from.winner:sb.from.loser) : null;
        }
        if(!m.a||!m.b) continue;
        const row = rowsByPair.get(pairKey(m.a.name, m.b.name));
        if(row){
          const w = bkKey(row.Winner)===bkKey(m.a.name) ? m.a : m.b;
          m.done=true; m.winner=w; m.loser=(w===m.a)?m.b:m.a; m.row=row; changed=true;
        }
      }
    }
    br.matches.forEach(m=>{ m.ready = !m.done && !!m.a && !!m.b; });

    br.placements={};
    br.matches.forEach(m=>{
      if(m.decides && m.done){
        br.placements[m.decides[0]]=m.winner;
        br.placements[m.decides[1]]=m.loser;
      }
    });
    br.complete = [1,2,3,4].every(p=>!!br.placements[p]);
    return br;
  }

  /* Pull bracket results out of the R5 + R6 score rows. Rows whose MatchType
     looks like a bracket match win; anything else is only a fallback. */
  function indexRows(rows){
    const primary=new Map(), fallback=new Map();
    (rows||[]).forEach(r=>{
      const w=bkFmt(r.Winner), o=bkFmt(r.Opponent);
      if(!w||!o||bkKey(w)===bkKey(o)) return;
      const t=String(r.MatchType||'');
      (BRACKET_TYPE_RE.test(t) ? primary : fallback).set(pairKey(w,o), r);
    });
    fallback.forEach((v,k)=>{ if(!primary.has(k)) primary.set(k,v); });
    return primary;
  }

  return { build, resolve, indexRows, srcDesc, pairKey };
})();

function loadCSV(u){ return new Promise((res,rej)=>Papa.parse(bustUrl(u),{download:true,header:true,skipEmptyLines:'greedy',complete:r=>res(r.data||[]),error:rej})); }
const nameKey=s=>String(s||'').trim().toLowerCase();
const num=v=>(v===null||v===undefined||v==='')? NaN:+String(v).replace(/[% ,]/g,'');
const safeNum=v=>{const n=num(v);return isNaN(n)?0:n;};
const fmt=v=>(v===undefined||v===null)?'':String(v);
const round2=x=>Math.round((Number(x)+Number.EPSILON)*100)/100;
const fmtPts=v=>(v===undefined||v===null||v==='')? '':(isNaN(Number(v))?'':round2(v).toFixed(2));

function fmtDateRange(s0,e0){
  const parse=v=>{if(v===''||v==null)return null;if(/^\d+(\.\d+)?$/.test(String(v))){const d=Number(v),base=new Date(Date.UTC(1899,11,30));return new Date(base.getTime()+d*86400000);}const d=new Date(v);return isNaN(d)?null:d;};
  const s=parse(s0),e=parse(e0),nice=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  if(s&&e)return`${nice(s)} – ${nice(e)}`;if(s)return nice(s);if(e)return nice(e);
  return[fmt(s0),fmt(e0)].filter(Boolean).join(' – ');
}

function hasThirdSetTB(row){return fmt(row.TB_W)!==''||fmt(row.TB_O)!=='';}
function formatThirdEntry(row,p){
  if(!hasThirdSetTB(row)){const W3=fmt(row.S3_W),O3=fmt(row.S3_O);if(W3===''&&O3==='')return'';return p==='winner'?`${W3}-${O3}`:`${O3}-${W3}`;}
  const a=fmt(row.TB_W),b=fmt(row.TB_O);if(a===''&&b==='')return'';
  return p==='winner'?` ${a}-${b}`:`  ${b}-${a}`;
}
function statusText(row){return String(row.Status||row.STATUS||'').trim();}
function isWalkover(row){const s=statusText(row).toLowerCase();return s==='walkover'||s==='wo'||s==='w/o'||s.includes('walkover');}
function isRetired(row){const s=statusText(row).toLowerCase();return s==='retired'||s==='ret'||s.includes('retired');}

function resultString(row,p,rankByName){
  const w=fmt(row.Winner),o=fmt(row.Opponent);
  const wR=rankByName[nameKey(w)]||'?',oR=rankByName[nameKey(o)]||'?';
  let sc;
  if(isWalkover(row)){sc='walkover';}
  else{
    const W1=fmt(row.S1_W),O1=fmt(row.S1_O),W2=fmt(row.S2_W),O2=fmt(row.S2_O);
    sc=(p==='winner')?`${W1}-${O1} ${W2}-${O2}${formatThirdEntry(row,'winner')}`:`${O1}-${W1} ${O2}-${W2}${formatThirdEntry(row,'opponent')}`;
    if(isRetired(row))sc+=' Ret';
  }
  return(p==='winner')?`Beat #${oR} ${o} ${sc}`:`Lost to #${wR} ${w} ${sc}`;

function parseGameTotals(row){
  if('GamesWon' in row&&'GamesLost' in row){const w=safeNum(row.GamesWon),o=safeNum(row.GamesLost);return{wGames:w,oGames:o,diff:Math.max(0,w-o)};}
  const W1=safeNum(row.S1_W),O1=safeNum(row.S1_O),W2=safeNum(row.S2_W),O2=safeNum(row.S2_O),W3=safeNum(row.S3_W),O3=safeNum(row.S3_O),TBW=safeNum(row.TB_W),TBO=safeNum(row.TB_O);
  let wG=W1+W2,oG=O1+O2;
  if(hasThirdSetTB(row)){if(TBW>TBO)wG+=1;else if(TBO>TBW)oG+=1;}else if(W3!==0||O3!==0){wG+=W3;oG+=O3;}
  return{wGames:wG,oGames:oG,diff:Math.max(0,wG-oG)};
}

/* ===== BRACKET STAGE: data ===== */
let BRACKET = null;          // resolved bracket for the current page load
let BRACKET_NAMES = new Set(); // nameKeys of the 4 bracket teams (hidden from the ladder table)

/* Seed the top 4 by their R{BRACKET_START_ROUND} rank and apply R5 + R6 results. */
async function loadBracket(){
  const [playersRaw, r5, r6] = await Promise.all([
    loadCSV(CSV.Players),
    loadCSV(CSV[`ScoresRound${BRACKET_START_ROUND}`]).catch(()=>[]),
    (CSV[`ScoresRound${BRACKET_FINAL_ROUND}`] ? loadCSV(CSV[`ScoresRound${BRACKET_FINAL_ROUND}`]).catch(()=>[]) : Promise.resolve([]))
  ]);
  const r = BRACKET_START_ROUND;
  const phones={};
  const active=(playersRaw||[]).filter(row=>{
    const st=num(row.RStart), en=num(row.REnd);
    return (isNaN(st)||st<=r) && (isNaN(en)||en>=r);
  });
  active.forEach(row=>{
    const nm=fmt(row.Team||row.Participant||row.Name); if(!nm) return;
    phones[nameKey(nm)]=[fmt(row.PHONE1||row.Phone1||row.PHONE||row.Phone||''),fmt(row.PHONE2||row.Phone2||'')].filter(Boolean);
  });
  const seeded = active
    .map(row=>({name:fmt(row.Team||row.Participant||row.Name), rank:num(row[`R${r}Rank`])}))
    .filter(t=>t.name && !isNaN(t.rank) && t.rank>0)
    .sort((a,b)=>a.rank-b.rank)
    .slice(0,BRACKET_TEAMS)
    .map((t,i)=>({name:t.name, seed:i+1}));

  if(seeded.length < BRACKET_TEAMS) throw new Error(`Only ${seeded.length} team(s) have an R${r}Rank — the top ${BRACKET_TEAMS} can't be seeded yet.`);

  const br = BK.resolve(BK.build(seeded), BK.indexRows([...(r5||[]), ...(r6||[])]));
  br.phones = phones;
  return br;
}

function bktScore(row){
  if(!row) return '';
  const st=String(row.Status||row.STATUS||'').toLowerCase();
  if(st.includes('walkover')||st==='wo'||st==='w/o') return 'walkover';
  const parts=[];
  const set=(w,o)=>{ if(fmt(w)===''&&fmt(o)==='') return; parts.push(`${fmt(w)}-${fmt(o)}`); };
  set(row.S1_W,row.S1_O); set(row.S2_W,row.S2_O); set(row.S3_W,row.S3_O);
  if(fmt(row.TB_W)!==''||fmt(row.TB_O)!=='') parts.push(`[${fmt(row.TB_W)}-${fmt(row.TB_O)}]`);
  let s=parts.join(' ');
  if(st.includes('retired')||st==='ret') s+=' Ret';
  return s;
}

    }).filter(t=>t.name&&!isNaN(t.LeftRank)&&t.LeftRank>0).sort((a,b)=>a.LeftRank-b.LeftRank);

    const scheduledMap=new Map(),challengesMap=new Map();
    const pushChal=(k,m)=>{const arr=challengesMap.get(k)||[];if(arr.length<2){arr.push(m);challengesMap.set(k,arr);}};
    scoresRaw.forEach(r=>{
      const type=String(r.MatchType||'').trim();if(type!=='Scheduled'&&type!=='Challenge')return;

      const hi=(ROUND===CurrentRound)&&schedOppName&&hasPlayedRecently(t.name,schedOppName);

        }else{
          const pts=fmt(row.LosePoints||row.LoserPoints||row.LPts||'');if(!pts)return null;
          const p=document.createElement('span');p.className='loser-pts';
          p.setAttribute('data-points',pts);p.setAttribute('data-gw',gt.oGames);
          if(chalDiv)p.setAttribute('data-chaldiv',chalDiv);
          p.innerHTML=`<b>${fmtPts(pts)}</b><span class="pts-hint">?</span>`;
          return p;
        }
      }

      /* Populate a scheduled match line (shared between desktop + mobile) */
      function fillSched(line){
        if(sr){
          const p=nameKey(fmt(sr.Winner))===meKey?'winner':'opponent';
          const span=document.createElement('span');span.className='result '+(p==='winner'?'won':'lost');
          highlightText(span,resultString(sr,p,rankByName),schedOppName,hi);
          line.appendChild(span);
          const pill=makePill(p==='winner',sr,null);if(pill)line.appendChild(pill);
        }else{
          const oR=scheduleMap[t.LeftRank];
          if(oR){
            const oppName=nameByRank[oR]||'';
            const pre=document.createElement('span');pre.textContent=`vs #${oR} `;line.appendChild(pre);
            const ns=document.createElement('span');if(hi)ns.className='repeat-opp';ns.textContent=oppName;line.appendChild(ns);
            /* That opponent may have moved into the championship bracket this round. */
            const tail=document.createElement('span');
            if(oppName&&BRACKET_NAMES.has(nameKey(oppName))){
              tail.className='in-bracket';tail.textContent=' — in bracket play, no ladder match';
            }else{
              tail.className='pending';tail.textContent=' — pending';
            }
            line.appendChild(tail);
          }
        }
      }

      /* Populate a challenge match line */
      function fillChal(line,cr){
        const p=nameKey(fmt(cr.Winner))===meKey?'winner':'opponent';
        const oppName=p==='winner'?fmt(cr.Opponent):fmt(cr.Winner);
        const span=document.createElement('span');span.className='result '+(p==='winner'?'won':'lost');
        highlightText(span,resultString(cr,p,rankByName),oppName,false);
        line.appendChild(span);
        const cd=cr.ChalDiv||cr.ChallengeDivisor||(hasScheduledPlayed?2:4);
        const pill=makePill(p==='winner',cr,cd);if(pill)line.appendChild(pill);
      }

      /* ── DESKTOP ROW ── */
      const tr=document.createElement('tr');tr.className=groupClass;

      // Left rank/pts
      const tdL=document.createElement('td');tdL.className='rp rp-left';
      tdL.innerHTML=`#${t.LeftRank}<span class="sub">${isNaN(t.LeftPts)?'&nbsp;':fmtPts(t.LeftPts)+' pts'}</span>`;
      tr.appendChild(tdL);

      // Team + phones
      const tdT=document.createElement('td');tdT.className='team-cell';
      const tn=document.createElement('div');tn.className='team-name';tn.textContent=t.name;tdT.appendChild(tn);
      phones.forEach((ph,i)=>{
        const row=document.createElement('div');row.className='player-row';
        const lbl=document.createElement('span');lbl.className='player-label';lbl.textContent=`Player ${i+1}:`;row.appendChild(lbl);
        const rev=makePhoneReveal(ph);if(rev)row.appendChild(rev);
        tdT.appendChild(row);
      });
      tr.appendChild(tdT);

      // Results
      const tdR=document.createElement('td');tdR.className='matches';
      const sl=document.createElement('div');
      if(sr||scheduleMap[t.LeftRank]){
        sl.className='match-line';
        const b=document.createElement('span');b.className='badge badge-scheduled';b.textContent='Scheduled';sl.appendChild(b);
        fillSched(sl);
      }else{sl.className='match-line empty';sl.innerHTML='&nbsp;';}
      tdR.appendChild(sl);
      for(let ci=0;ci<2;ci++){
        const cr=myChals[ci];
        if(cr){
          const cl=document.createElement('div');cl.className='match-line';
          const b=document.createElement('span');b.className='badge badge-challenge';b.textContent='Challenge';cl.appendChild(b);
          fillChal(cl,cr);tdR.appendChild(cl);
        }else{const cl=document.createElement('div');cl.className='match-line empty';cl.innerHTML='&nbsp;';tdR.appendChild(cl);}
      }
      tr.appendChild(tdR);

      // Right rank/pts
      const tdRR=document.createElement('td');tdRR.className='rp right rp-right';
      const hasR=!isNaN(t.RightRank)&&t.RightRank>0;
      let mv='';
      if(hasR){const d=t.LeftRank-t.RightRank;mv=d>0?`<span class="move move-up">↑${d}</span>`:d<0?`<span class="move move-down">↓${Math.abs(d)}</span>`:`<span class="move move-same">—</span>`;}
      tdRR.innerHTML=`${hasR?`#${t.RightRank}`:'&nbsp;'}${mv}<span class="sub">${hasR?fmtPts(t.RightPts)+' pts':'&nbsp;'}</span>`;
      tr.appendChild(tdRR);
      tbody.appendChild(tr);

      /* ── MOBILE CARD ── */
      const card=document.createElement('div');card.className='m-card';
      card.style.borderLeftColor=groupColor(t.LeftRank);

      const inner=document.createElement('div');inner.className='m-card-inner';

      // Top row: rank + team name + pts pill
      const mTop=document.createElement('div');mTop.className='m-top';
      const mRank=document.createElement('div');mRank.className='m-rank';mRank.textContent=`#${t.LeftRank}`;mTop.appendChild(mRank);
      const mName=document.createElement('div');mName.className='m-team-name';mName.textContent=t.name;mTop.appendChild(mName);
      if(!isNaN(t.LeftPts)){
        const mPill=document.createElement('div');mPill.className='m-pts-pill';
        mPill.innerHTML=`R${ROUND} <b>${fmtPts(t.LeftPts)}</b> pts`;mTop.appendChild(mPill);
      }
      inner.appendChild(mTop);

      // Phones
      if(phones.length){
        const mPh=document.createElement('div');mPh.className='m-phones';
        phones.forEach((ph,i)=>{
          const item=document.createElement('div');item.className='m-phone-item';
          const lbl=document.createElement('span');lbl.className='m-phone-label';lbl.textContent=`P${i+1}:`;item.appendChild(lbl);
          const rev=makePhoneReveal(ph);if(rev)item.appendChild(rev);
          mPh.appendChild(item);
        });
        inner.appendChild(mPh);
      }

      // Matches
      const mMatches=document.createElement('div');mMatches.className='m-matches';

      // Scheduled
      if(sr||scheduleMap[t.LeftRank]){
        const ml=document.createElement('div');ml.className='m-match-line';
        const b=document.createElement('span');b.className='badge badge-scheduled';b.textContent='Scheduled';ml.appendChild(b);
        fillSched(ml);
        mMatches.appendChild(ml);
      }

      // Challenges
      myChals.forEach(cr=>{
        const ml=document.createElement('div');ml.className='m-match-line';
        const b=document.createElement('span');b.className='badge badge-challenge';b.textContent='Challenge';ml.appendChild(b);
        fillChal(ml,cr);
        mMatches.appendChild(ml);
      });

      if(mMatches.children.length===0){
        const ml=document.createElement('div');ml.className='m-match-line';
        const sp=document.createElement('span');sp.className='pending';sp.textContent='No match scheduled';ml.appendChild(sp);
        mMatches.appendChild(ml);
      }

      inner.appendChild(mMatches);
      card.appendChild(inner);

      // Bottom strip: next round rank + movement + pts
      const mBot=document.createElement('div');mBot.className='m-bottom';
      if(hasR){
        const d=t.LeftRank-t.RightRank;
        const mv2=d>0?`<span class="move move-up">↑${d}</span>`:d<0?`<span class="move move-down">↓${Math.abs(d)}</span>`:`<span class="move move-same">—</span>`;
        mBot.innerHTML=`R${ROUND+1}: <b>#${t.RightRank}</b>${mv2} &nbsp;·&nbsp; <b>${fmtPts(t.RightPts)}</b> pts`;
      }else{
        mBot.innerHTML=`R${ROUND+1}: <span style="color:#3a4f6a">not yet ranked</span>`;
      }
      card.appendChild(mBot);
      mobileList.appendChild(card);
    });

    document.getElementById('ladder').style.display='';
    document.getElementById('status').style.display='none';
    setStatus('');

  }catch(err){
    console.error(err);
    setStatus('There was a problem loading your data. Double-check the CSV links and headers.',true);
  }
}

function buildRoundSelect(){
  const sel=document.getElementById('roundSelect');sel.innerHTML='';
  for(let r=1;r<=CurrentRound;r++){
    const opt=document.createElement('option');opt.value=String(r);
    opt.textContent = r===BRACKET_START_ROUND ? `Round ${r} – Semifinals`
                    : r===BRACKET_FINAL_ROUND ? `Round ${r} – Final`
                    : `Round ${r}`;
    sel.appendChild(opt);
  }
  sel.value=String(ROUND);
  sel.addEventListener('change',()=>{const r=parseInt(sel.value,10);if(!isNaN(r)&&r>=1&&r<=CurrentRound)init(r);});
}

/* Modal */
const backdropEl=document.getElementById('backdrop'),modalEl=document.getElementById('modal');
const modalBody=document.getElementById('modalBody'),modalTitle=document.getElementById('modalTitle');
document.getElementById('modalClose').addEventListener('click',closeModal);
backdropEl.addEventListener('click',closeModal);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function openModal(title,html){modalTitle.textContent=title||'Info';modalBody.innerHTML=html;backdropEl.classList.add('show');modalEl.classList.add('show');document.documentElement.style.overflow='hidden';}
function closeModal(){modalEl.classList.remove('show');backdropEl.classList.remove('show');document.documentElement.style.overflow='';}

function handlePointsClick(e){
  const lb=e.target.closest('.loser-pts'),wb=e.target.closest('.winner-pts');
  if(!lb&&!wb)return;
  e.preventDefault();e.stopPropagation();
  if(lb){
    const pts=lb.getAttribute('data-points')||'',gw=lb.getAttribute('data-gw')||'0',div=lb.getAttribute('data-chaldiv')||'';
    openModal('Loser Points',`<p><strong>Points:</strong> ${pts}</p><p><strong>Games won:</strong> ${gw}</p>${div?`<p><strong>Challenge divisor:</strong> ${div}</p><p class="tip">Divided by 2 if scheduled match played; by 4 if not.</p>`:''}<p class="tip">Loser points = games won (max 10).</p>`);
    return;
  }
  const pts=wb.getAttribute('data-points')||'',gw=wb.getAttribute('data-gw')||'0',gl=wb.getAttribute('data-gl')||'0',gd=wb.getAttribute('data-gdiff')||'0',div=wb.getAttribute('data-chaldiv')||'';
  openModal('Winner Points',`<p><strong>Points:</strong> ${pts}</p><p><strong>Games won:</strong> ${gw}, <strong>lost:</strong> ${gl}, <strong>diff:</strong> ${gd}</p>${div?`<p><strong>Challenge divisor:</strong> ${div}</p><p class="tip">Divided by 2 if scheduled match played; by 4 if not.</p>`:''}<p class="tip">Winner points = 10 + game diff, min 11.</p>`);
}
document.addEventListener('click',handlePointsClick,{capture:false});
document.addEventListener('pointerup',handlePointsClick,{capture:false});

/* Boot */
(async function boot(){
  await fetchCurrentRound();
  buildRoundSelect();
  ROUND=computeRoundFromURL();
  init(ROUND);
})();

let _lastVisible=Date.now();
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='hidden'){_lastVisible=Date.now();return;}
  if(Date.now()-_lastVisible<60000)return;
  _lastVisible=Date.now();
  const prev=CurrentRound;
  await fetchCurrentRound();
  if(CurrentRound!==prev)buildRoundSelect();
  init(ROUND);
});
</script>
</body>
</html>
